// Helper: Normalitzador de respostes
function normalizeInput(str) {
  return (str || '')
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, ' ');
}

function checkVerbAnswers(expectedStr, userStr) {
  const normUser = normalizeInput(userStr);
  const options = expectedStr.split(/[\/\,]+/).map(s => normalizeInput(s.trim()));
  return options.some(opt => opt === normUser);
}

// ---------------------------------------------------------
// Component VerbsTrainer (Hyper-Flow & Bidireccional)
// ---------------------------------------------------------
function VerbsTrainer() {
  const [index, setIndex] = useState(0);
  const [baseInput, setBaseInput] = useState('');
  const [pastInput, setPastInput] = useState('');
  const [partInput, setPartInput] = useState('');
  const [transInput, setTransInput] = useState('');
  const [evaluated, setEvaluated] = useState(false);
  const [score, setScore] = useState({ correct: 0, total: 0 });

  const currentVerb = VERBS_DATA[index];
  const baseInputRef = useRef(null);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (evaluated) {
      handleNext();
      return;
    }

    const pastOk = checkVerbAnswers(currentVerb.past, pastInput);
    const partOk = checkVerbAnswers(currentVerb.participle, partInput);
    const transOk = checkVerbAnswers(currentVerb.catalan, transInput);

    const isAllCorrect = pastOk && partOk && transOk;
    setScore(prev => ({
      correct: prev.correct + (isAllCorrect ? 1 : 0),
      total: prev.total + 1
    }));
    setEvaluated(true);
  };

  const handleNext = () => {
    setPastInput('');
    setPartInput('');
    setTransInput('');
    setEvaluated(false);
    setIndex((prev) => (prev + 1) % VERBS_DATA.length);
  };

  const handlePrev = () => {
    setPastInput('');
    setPartInput('');
    setTransInput('');
    setEvaluated(false);
    setIndex((prev) => (prev - 1 + VERBS_DATA.length) % VERBS_DATA.length);
  };

  const pastCorrect = evaluated ? checkVerbAnswers(currentVerb.past, pastInput) : null;
  const partCorrect = evaluated ? checkVerbAnswers(currentVerb.participle, partInput) : null;
  const transCorrect = evaluated ? checkVerbAnswers(currentVerb.catalan, transInput) : null;

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      {/* Targeta Principal */}
      <div className="bg-white border border-slate-200 rounded-2xl shadow-lg p-6 sm:p-8">
        <div className="flex items-center justify-between pb-4 border-b border-slate-100">
          <div className="flex items-center gap-2">
            <span className="bg-oxford-900 text-white font-mono text-xs px-2.5 py-1 rounded-md font-bold">
              Verb #{currentVerb.id} / 162
            </span>
            <span className="text-xs font-mono text-slate-500">PAU Hyper-Flow</span>
          </div>
          <div className="text-xs font-mono text-slate-600 bg-slate-50 px-2.5 py-1 rounded-md border border-slate-200">
            Encerts: <strong className="text-emerald-600">{score.correct}</strong> / {score.total}
          </div>
        </div>

        {/* Prompt Central */}
        <div className="text-center my-6">
          <span className="text-xs font-mono uppercase tracking-widest text-slate-400">Infinitive / Base Form</span>
          <h2 className="text-4xl sm:text-5xl font-serif-academic font-bold text-oxford-950 mt-1">
            {currentVerb.base}
          </h2>
          <p className="text-xs font-mono text-slate-500 mt-1">
            Introdueix el Past Simple, Past Participle i la traducció al català
          </p>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            {/* Past Simple */}
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">
                Past Simple
              </label>
              <input
                type="text"
                value={pastInput}
                onChange={(e) => setPastInput(e.target.value)}
                placeholder="ex. did"
                disabled={evaluated}
                className={`w-full px-3.5 py-2.5 rounded-lg border text-sm focus:outline-none transition-all ${
                  evaluated
                    ? pastCorrect
                      ? 'border-emerald-500 bg-emerald-50/50 text-emerald-900 font-bold'
                      : 'border-crimson-600 bg-crimson-50 text-crimson-900 font-bold'
                    : 'border-slate-300 focus:border-oxford-800 focus:ring-1 focus:ring-oxford-800'
                }`}
              />
              {evaluated && !pastCorrect && (
                <p className="text-[11px] font-mono text-crimson-700 mt-1">
                  Correcte: <strong>{currentVerb.past}</strong>
                </p>
              )}
            </div>

            {/* Past Participle */}
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">
                Past Participle
              </label>
              <input
                type="text"
                value={partInput}
                onChange={(e) => setPartInput(e.target.value)}
                placeholder="ex. done"
                disabled={evaluated}
                className={`w-full px-3.5 py-2.5 rounded-lg border text-sm focus:outline-none transition-all ${
                  evaluated
                    ? partCorrect
                      ? 'border-emerald-500 bg-emerald-50/50 text-emerald-900 font-bold'
                      : 'border-crimson-600 bg-crimson-50 text-crimson-900 font-bold'
                    : 'border-slate-300 focus:border-oxford-800 focus:ring-1 focus:ring-oxford-800'
                }`}
              />
              {evaluated && !partCorrect && (
                <p className="text-[11px] font-mono text-crimson-700 mt-1">
                  Correcte: <strong>{currentVerb.participle}</strong>
                </p>
              )}
            </div>

            {/* Traducció en Català */}
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">
                Traducció (Català)
              </label>
              <input
                type="text"
                value={transInput}
                onChange={(e) => setTransInput(e.target.value)}
                placeholder="ex. fer"
                disabled={evaluated}
                className={`w-full px-3.5 py-2.5 rounded-lg border text-sm focus:outline-none transition-all ${
                  evaluated
                    ? transCorrect
                      ? 'border-emerald-500 bg-emerald-50/50 text-emerald-900 font-bold'
                      : 'border-crimson-600 bg-crimson-50 text-crimson-900 font-bold'
                    : 'border-slate-300 focus:border-oxford-800 focus:ring-1 focus:ring-oxford-800'
                }`}
              />
              {evaluated && !transCorrect && (
                <p className="text-[11px] font-mono text-crimson-700 mt-1">
                  Correcte: <strong>{currentVerb.catalan}</strong>
                </p>
              )}
            </div>
          </div>

          <div className="pt-4 flex items-center justify-between gap-3">
            <button
              type="button"
              onClick={handlePrev}
              className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition-all"
            >
              &larr; Anterior
            </button>

            <button
              type="submit"
              className={`flex-1 max-w-xs py-2.5 px-6 rounded-lg font-bold text-sm shadow-sm transition-all text-white ${
                evaluated
                  ? 'bg-oxford-900 hover:bg-oxford-800'
                  : 'bg-crimson-700 hover:bg-crimson-800'
              }`}
            >
              {evaluated ? 'Següent Verb (Enter) \u2192' : 'Verificar Resposta'}
            </button>

            <button
              type="button"
              onClick={handleNext}
              className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition-all"
            >
              Ometre &rarr;
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

  const [errorMsg, setErrorMsg] = useState('');
  const [successMsg, setSuccessMsg] = useState('');

  useEffect(() => {
    if (supabaseClient) {
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        setSession(session);
        setLoading(false);
      }).catch(() => setLoading(false));

      const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
        setSession(session);
        setLoading(false);
      });
      return () => subscription.unsubscribe();
    } else {
      setLoading(false);
    }
  }, []);

  const handleAuth = async (e) => {
    e.preventDefault();
    setErrorMsg('');
    setSuccessMsg('');

    if (!email || !password) {
      setErrorMsg('Si us plau, omple tots els camps obligatoris.');
      return;
    }
    if (password.length < 6) {
      setErrorMsg('La contrasenya ha de tenir un mínim de 6 caràcters.');
      return;
    }
    if (!supabaseClient) {
      setErrorMsg('Error de connexió: client Supabase no disponible.');
      return;
    }

    setActionLoading(true);
    try {
      if (authMode === 'login') {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email.trim(),
          password: password,
        });
        if (error) {
          setErrorMsg(error.message.includes('Invalid login credentials') 
            ? 'Correu o contrasenya incorrectes.' 
            : error.message);
        } else if (data.session) {
          setSuccessMsg("Accés autoritzat. Benvingut de nou a l'acadèmia, alumne.");
          setSession(data.session);
        }
      } else {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email.trim(),
          password: password,
        });
        if (error) {
          setErrorMsg(error.message.includes('User already registered')
            ? 'Aquest correu ja està registrat. Inicia sessió.'
            : error.message);
        } else {
          setSuccessMsg("Registre completat. Benvingut a JP ENGLISH HUB. Preparant mòduls d'estudi...");
          if (data.session) {
            setSession(data.session);
          }
        }
      }
    } catch (err) {
      setErrorMsg('S\'ha produït un error de xarxa inesperat.');
    } finally {
      setActionLoading(false);
    }
  };

  const handleLogout = async () => {
    if (supabaseClient) {
      await supabaseClient.auth.signOut();
    }
    setSession(null);
  };

  if (loading) {
    return (
      <div className="min-h-screen bg-oxford-950 flex flex-col items-center justify-center text-white p-4">
        <div className="w-16 h-16 rounded-full border-2 border-amber-400 p-1 bg-white mb-4 animate-pulse">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDlUHs_Lm3e1aF3caKkwojFkvNIEoVWlzLtaQwYrZHCc56yKkYfr0cY20meD9rWGHtCRBZOiLe8cGAjGPcsNdvs42Jk0TzyQU8zujc2WhIJ7U4pj05U0STq2i3iqRYgpPRrfdQFm_XOyHkn5AAQhe-U70ZW1iNFEX174rf_BsCDu3AJ5SX9JtHmAtJwk313zcVS0fvTuoU36aAJUZOQ2CXPYJa-kXeXa-ZbBDwDUYF8b7zZIVq_E99yJw" alt="JP" className="w-full h-full object-cover rounded-full"/>
        </div>
        <p className="font-mono text-xs text-slate-300">Verificant sessió acadèmica...</p>
      </div>
    );
  }

  // Si hi ha sessió activa, renderitzar directament l'aplicació principal d'estudi
  if (session) {
    return (
      <App 
        userEmail={session.user?.email || 'Alumne PAU'} 
        onLogout={handleLogout} 
      />
    );
  }

  // Si no hi ha sessió, mostrar el portal d'accés
  return (
    <AuthView
      authMode={authMode}
      setAuthMode={(mode) => {
        setAuthMode(mode);
        setErrorMsg('');
        setSuccessMsg('');
      }}
      email={email}
      setEmail={setEmail}
      password={password}
      setPassword={setPassword}
      actionLoading={actionLoading}
      errorMsg={errorMsg}
      successMsg={successMsg}
      onSubmit={handleAuth}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthApp />);
</script>
</body></html>
