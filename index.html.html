function cleanStr(s) {
  return (s || '').toLowerCase().trim().replace(/[.,/#!$%^&*;:{}=\-_`~()?"']/g, "").replace(/\s+/g, ' ');
}

function checkVerbMatch(userVal, correctVal, altVal) {
  if (!userVal) return false;
  const cleanUser = userVal.toLowerCase().trim();
  const cleanCorrect = (correctVal || "").toLowerCase().trim();
  const cleanAlt = (altVal || "").toLowerCase().trim();
  return cleanUser === cleanCorrect || (cleanAlt && cleanUser === cleanAlt);
}

function checkMeaningMatch(userVal, meaningStr) {
  if (!userVal || !meaningStr) return false;
  const u = cleanStr(userVal);
  if (!u || u.length < 2) return false;
  const parts = meaningStr.split(/[,/]/).map(cleanStr);
  return parts.some(p => p === u);
}

// --- 1. VERBS TRAINER COMPONENT (WITH 🔊 PRONUNCIATION ICON) ---
function VerbsTrainer({ onCompleteAction }) {
  const [selectedGroup, setSelectedGroup] = useState('ALL');
  const [mode, setMode] = useState('forms'); // 'forms' | 'trans'
  const [transDirection, setTransDirection] = useState('eng_to_cat');
  const [answers, setAnswers] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('esh_verbs_answers') || '{}');
    } catch(e) { return {}; }
  });

  const filteredVerbs = useMemo(() => {
    if (selectedGroup === 'ALL') return VERBS_DATA;
    return VERBS_DATA.filter(v => v.type === selectedGroup);
  }, [selectedGroup]);

  const handleInputChange = (id, field, val) => {
    setAnswers(prev => {
      const updated = {
        ...prev,
        [id]: { ...(prev[id] || {}), [field]: val }
      };
      try {
        localStorage.setItem('esh_verbs_answers', JSON.stringify(updated));
      } catch(e) {}
      return updated;
    });
  };

  const handleKeyDown = (e, index, currentField) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (mode === 'forms') {
        if (currentField === 'past') {
          const nextInput = document.getElementById(`part-${index}`);
          if (nextInput) nextInput.focus();
        } else if (currentField === 'part') {
          const nextInput = document.getElementById(`past-${index + 1}`);
          if (nextInput) nextInput.focus();
        }
      } else {
        const nextInput = document.getElementById(`trans-${index + 1}`);
        if (nextInput) nextInput.focus();
      }
    }
  };

  const stats = useMemo(() => {
    let correctPast = 0;
    let correctPart = 0;
    let correctTrans = 0;

    filteredVerbs.forEach(v => {
      const a = answers[v.id] || {};
      if (checkVerbMatch(a.past, v.past, v.altPast)) correctPast++;
      if (checkVerbMatch(a.part, v.part, v.altPart)) correctPart++;
      if (transDirection === 'eng_to_cat') {
        if (checkMeaningMatch(a.trans, v.cat)) correctTrans++;
      } else {
        if (checkVerbMatch(a.trans, v.inf)) correctTrans++;
      }
    });

    return { correctPast, correctPart, correctTrans, total: filteredVerbs.length };
  }, [filteredVerbs, answers, transDirection]);

  return (
    <div className="space-y-6 max-w-4xl mx-auto">
      <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm space-y-4">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-4">
          <div>
            <h2 className="text-xl font-serif-academic font-bold text-oxford-950">Entrenador de Verbs Irregulars</h2>
            <p className="text-xs text-slate-500 font-sans mt-0.5">162 Verbs amb validació i registre d'avanç continuat.</p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setMode('forms')} className={`px-3 py-1.5 rounded text-xs font-semibold transition-all ${mode === 'forms' ? 'bg-oxford-900 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Formes (Past/Part)</button>
            <button onClick={() => setMode('trans')} className={`px-3 py-1.5 rounded text-xs font-semibold transition-all ${mode === 'trans' ? 'bg-oxford-900 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Traducció</button>
          </div>
        </div>

        <div className="flex flex-wrap items-center justify-between gap-3 text-xs">
          <div className="flex flex-wrap items-center gap-1.5">
            {['ALL', 'AAA', 'ABA', 'ABB', 'ABC'].map(grp => (
              <button key={grp} onClick={() => setSelectedGroup(grp)} className={`px-2.5 py-1 rounded font-mono font-medium transition-all ${selectedGroup === grp ? 'bg-crimson-700 text-white font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                {grp === 'ALL' ? 'Tots (162)' : `Grup ${grp}`}
              </button>
            ))}
          </div>

          {mode === 'trans' && (
            <div className="flex items-center gap-2">
              <span className="text-slate-500 font-sans">Sentit:</span>
              <button onClick={() => setTransDirection(d => d === 'eng_to_cat' ? 'cat_to_eng' : 'eng_to_cat')} className="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 font-medium text-oxford-900 border border-slate-200">
                {transDirection === 'eng_to_cat' ? 'Anglès → Català' : 'Català → Anglès'}
              </button>
            </div>
          )}
        </div>

        <div className="pt-2 flex items-center justify-between text-xs font-mono border-t border-slate-100">
          <span className="text-slate-500">Comprovació de precisió:</span>
          {mode === 'forms' ? (
            <div className="flex gap-4">
              <span>Past: <strong className="text-emerald-600">{stats.correctPast}</strong>/{stats.total}</span>
              <span>Participle: <strong className="text-emerald-600">{stats.correctPart}</strong>/{stats.total}</span>
            </div>
          ) : (
            <span>Traduccions: <strong className="text-emerald-600">{stats.correctTrans}</strong>/{stats.total}</span>
          )}
        </div>
      </div>

      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs">
            <thead className="bg-[#002147] text-white font-mono uppercase text-[11px] tracking-wider">
              <tr>
                <th className="py-3 px-4 w-12 text-center">#</th>
                <th className="py-3 px-4">Grup</th>
                <th className="py-3 px-4">Infinitiu</th>
                {mode === 'forms' ? (
                  <>
                    <th className="py-3 px-4">Past Simple</th>
                    <th className="py-3 px-4">Past Participle</th>
                    <th className="py-3 px-4">Significat</th>
                  </>
                ) : (
                  <>
                    <th className="py-3 px-4">{transDirection === 'eng_to_cat' ? 'Introdueix en Català' : 'Introdueix Infinitiu'}</th>
                    <th className="py-3 px-4">Significat / Referència</th>
                  </>
                )}
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {filteredVerbs.map((v, idx) => {
                const a = answers[v.id] || {};
                const isPastCorrect = checkVerbMatch(a.past, v.past, v.altPast);
                const isPartCorrect = checkVerbMatch(a.part, v.part, v.altPart);
                const isTransCorrect = transDirection === 'eng_to_cat' 
                  ? checkMeaningMatch(a.trans, v.cat)
                  : checkVerbMatch(a.trans, v.inf);

                return (
                  <tr key={v.id} className="hover:bg-slate-50/70 transition-colors">
                    <td className="py-2.5 px-4 text-center font-mono text-slate-400">{v.id}</td>
                    <td className="py-2.5 px-4 font-mono font-semibold text-oxford-900">{v.type}</td>
                    <td className="py-2.5 px-4 font-bold text-oxford-950 font-serif-academic text-sm">
                      <div className="flex items-center gap-1.5">
                        <span>{v.inf}</span>
                        {/* 🔊 Pronunciation button reads ONLY verb.inf */}
                        <button
                          type="button"
                          onClick={(e) => speakEnglish(v.inf, e)}
                          className="text-slate-400 hover:text-crimson-700 transition-colors p-0.5 rounded text-xs select-none"
                          title={`Escoltar pronunciació de "${v.inf}"`}
                        >
                          🔊
                        </button>
                      </div>
                    </td>

                    {mode === 'forms' ? (
                      <>
                        <td className="py-2 px-4">
                          <input
                            id={`past-${idx}`}
                            type="text"
                            value={a.past || ''}
                            onChange={(e) => handleInputChange(v.id, 'past', e.target.value)}
                            onKeyDown={(e) => handleKeyDown(e, idx, 'past')}
                            placeholder={v.past.substring(0, 1) + '...'}
                            className={`w-32 px-2.5 py-1 rounded border text-xs font-mono transition-all ${
                              a.past
                                ? isPastCorrect
                                  ? 'bg-emerald-50 border-emerald-400 text-emerald-800 font-bold'
                                  : 'bg-rose-50 border-rose-300 text-rose-800'
                                : 'border-slate-200 focus:border-oxford-700'
                            }`}
                          />
                        </td>
                        <td className="py-2 px-4">
                          <input
                            id={`part-${idx}`}
                            type="text"
                            value={a.part || ''}
                            onChange={(e) => handleInputChange(v.id, 'part', e.target.value)}
                            onKeyDown={(e) => handleKeyDown(e, idx, 'part')}
                            placeholder={v.part.substring(0, 1) + '...'}
                            className={`w-32 px-2.5 py-1 rounded border text-xs font-mono transition-all ${
                              a.part
                                ? isPartCorrect
                                  ? 'bg-emerald-50 border-emerald-400 text-emerald-800 font-bold'
                                  : 'bg-rose-50 border-rose-300 text-rose-800'
                                : 'border-slate-200 focus:border-oxford-700'
                            }`}
                          />
                        </td>
                        <td className="py-2 px-4 text-slate-500 font-sans text-xs">{v.cat}</td>
                      </>
                    ) : (
                      <>
                        <td className="py-2 px-4">
                          <input
                            id={`trans-${idx}`}
                            type="text"
                            value={a.trans || ''}
                            onChange={(e) => handleInputChange(v.id, 'trans', e.target.value)}
                            onKeyDown={(e) => handleKeyDown(e, idx, 'trans')}
                            placeholder="Escriu la resposta..."
                            className={`w-64 px-2.5 py-1 rounded border text-xs font-sans transition-all ${
                              a.trans
                                ? isTransCorrect
                                  ? 'bg-emerald-50 border-emerald-400 text-emerald-800 font-bold'
                                  : 'bg-rose-50 border-rose-300 text-rose-800'
                                : 'border-slate-200 focus:border-oxford-700'
                            }`}
                          />
                        </td>
                        <td className="py-2 px-4 text-slate-500 font-sans text-xs">
                          {transDirection === 'eng_to_cat' ? v.cat : v.inf}
                        </td>
                      </>
                    )}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// --- 2. VOCAB TRAINER COMPONENT (WITH RESTORED KEYBOARD SHORTCUTS [1]/[2]/Space & 🔊 PRONUNCIATION) ---
function VocabTrainer({ session, onCompleteAction }) {
  const [selectedDay, setSelectedDay] = useState('Dilluns');
  const [direction, setDirection] = useState('eng_to_cat');
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [historyStack, setHistoryStack] = useState([]);
  const [masteredList, setMasteredList] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('esh_vocab_mastered_Dilluns') || '[]');
    } catch(e) { return []; }
  });

  const dayVocab = useMemo(() => {
    return VOCAB_DATA.filter(v => v.day === selectedDay);
  }, [selectedDay]);

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(`esh_vocab_mastered_${selectedDay}`) || '[]');
      setMasteredList(saved);
    } catch(e) {
      setMasteredList([]);
    }
    setCurrentIndex(0);
    setIsFlipped(false);
    setHistoryStack([]);
  }, [selectedDay]);

  const currentItem = dayVocab[currentIndex] || dayVocab[0];

  const handleNext = async (isHard) => {
    if (!currentItem) return;

    if (isHard && supabaseClient && session?.user?.id) {
      try {
        const { data } = await supabaseClient
          .from('user_mistakes')
          .select('mistake_count')
          .eq('user_id', session.user.id)
          .eq('word_id', currentItem.id)
          .single();

        const currentCount = data?.mistake_count || 0;
        await supabaseClient
          .from('user_mistakes')
          .upsert({
            user_id: session.user.id,
            word_id: currentItem.id,
            mistake_count: currentCount + 1,
            last_practiced: new Date().toISOString()
          }, { onConflict: 'user_id,word_id' });
      } catch(e) {
        console.error('Error sincronitzant errada a Supabase:', e);
      }
    }

    if (!isHard) {
      setMasteredList(prev => {
        if (!prev.includes(currentItem.id)) {
          const updated = [...prev, currentItem.id];
          try {
            localStorage.setItem(`esh_vocab_mastered_${selectedDay}`, JSON.stringify(updated));
          } catch(e) {}
          return updated;
        }
        return prev;
      });
    }

    setHistoryStack(prev => [...prev, { index: currentIndex, flipped: isFlipped }]);
    setIsFlipped(false);

    if (currentIndex < dayVocab.length - 1) {
      setCurrentIndex(i => i + 1);
    } else {
      if (window.confetti) window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      if (onCompleteAction) onCompleteAction();
    }
  };

  // RESTORED KEYBOARD SHORTCUTS: Space = Flip, 1 = Difícil, 2 = Ho recordo bé
  useEffect(() => {
    const handleKeyDown = (e) => {
      // Ignore if user is inside an input or textarea
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

      if (e.code === 'Space') {
        e.preventDefault();
        setIsFlipped(f => !f);
      } else if (e.key === '1') {
        e.preventDefault();
        handleNext(true); // Difícil
      } else if (e.key === '2') {
        e.preventDefault();
        handleNext(false); // Ho recordo bé
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [currentIndex, isFlipped, currentItem, selectedDay, dayVocab]);

  const handleUndo = () => {
    if (historyStack.length === 0) return;
    const last = historyStack[historyStack.length - 1];
    setHistoryStack(prev => prev.slice(0, -1));
    setCurrentIndex(last.index);
    setIsFlipped(last.flipped);
  };

  return (
    <div className="space-y-6 max-w-xl mx-auto">
      <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
        <div className="flex items-center gap-1.5">
          {['Dilluns', 'Dimarts', 'Divendres'].map(day => (
            <button key={day} onClick={() => setSelectedDay(day)} className={`px-3 py-1.5 rounded font-semibold transition-all ${selectedDay === day ? 'bg-crimson-700 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
              {day}
            </button>
          ))}
        </div>

        <button onClick={() => setDirection(d => d === 'eng_to_cat' ? 'cat_to_eng' : 'eng_to_cat')} className="px-3 py-1.5 rounded bg-slate-100 hover:bg-slate-200 border border-slate-200 font-medium text-oxford-900 transition-all">
          {direction === 'eng_to_cat' ? 'Anglès → Català' : 'Català → Anglès'}
        </button>
      </div>

      <div className="flex items-center justify-between text-xs px-1 font-mono">
        <span className="text-slate-500">Targeta <strong>{currentIndex + 1}</strong> de {dayVocab.length}</span>
        <span className="text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
          Consolidades: {masteredList.length}/{dayVocab.length}
        </span>
      </div>

      {/* 3D FLASHCARD CONTAINER */}
      <div className="w-full h-80 perspective-container cursor-pointer select-none" onClick={() => setIsFlipped(f => !f)}>
        <div className={`card-3d-inner ${isFlipped ? 'flipped' : ''}`}>
          
          {/* FRONT */}
          <div className="card-face bg-white border-2 border-slate-200/90 p-8 flex flex-col justify-between items-center text-center shadow-md hover:border-oxford-300 transition-colors">
            <div className="w-full flex items-center justify-between text-xs text-slate-400 font-mono">
              <span className="uppercase tracking-wider">{selectedDay} &bull; PAU</span>
              <span>Anvers (Clica per girar o prem Espai)</span>
            </div>

            <div className="my-auto px-4">
              <p className="text-xs uppercase font-mono tracking-widest text-crimson-700 font-bold mb-2">
                {direction === 'eng_to_cat' ? 'Expressió en Anglès' : 'Traducció en Català'}
              </p>
              <div className="flex items-center justify-center gap-2">
                <h3 className="text-xl sm:text-2xl font-serif-academic font-bold text-oxford-950 leading-snug">
                  {direction === 'eng_to_cat' ? currentItem?.eng : currentItem?.cat}
                </h3>
                {/* 🔊 Audio icon if English is on front */}
                {direction === 'eng_to_cat' && currentItem?.eng && (
                  <button
                    type="button"
                    onClick={(e) => speakEnglish(currentItem.eng, e)}
                    className="p-1 rounded hover:bg-slate-100 text-slate-400 hover:text-crimson-700 transition-colors text-base select-none shrink-0"
                    title="Escoltar pronunciació en anglès britànic"
                  >
                    🔊
                  </button>
                )}
              </div>
            </div>

            <span className="text-[11px] text-slate-400 font-mono">Espai / Clic per comprovar revers &rarr;</span>
          </div>

          {/* BACK */}
          <div className="card-face card-face-back bg-gradient-to-b from-[#001f44] to-[#00152e] text-white p-8 flex flex-col justify-between items-center text-center shadow-lg border-2 border-oxford-800">
            <div className="w-full flex items-center justify-between text-xs text-amber-300/80 font-mono">
              <span className="uppercase tracking-wider">{selectedDay} &bull; Solució</span>
              <span>Revers</span>
            </div>

            <div className="my-auto px-4">
              <p className="text-xs uppercase font-mono tracking-widest text-amber-300 font-bold mb-2">
                {direction === 'eng_to_cat' ? 'Significat en Català' : 'Expressió en Anglès'}
              </p>
              <div className="flex items-center justify-center gap-2">
                <h3 className="text-xl sm:text-2xl font-serif-academic font-bold text-white leading-snug">
                  {direction === 'eng_to_cat' ? currentItem?.cat : currentItem?.eng}
                </h3>
                {/* 🔊 Audio icon if English is on back */}
                {direction === 'cat_to_eng' && currentItem?.eng && (
                  <button
                    type="button"
                    onClick={(e) => speakEnglish(currentItem.eng, e)}
                    className="p-1 rounded hover:bg-white/10 text-amber-300 hover:text-amber-200 transition-colors text-base select-none shrink-0"
                    title="Escoltar pronunciació en anglès britànic"
                  >
                    🔊
                  </button>
                )}
              </div>
            </div>

            <span className="text-[11px] text-slate-300 font-mono">Avalua la teva retenció</span>
          </div>

        </div>
      </div>

      {/* ACTION CONTROLS WITH [1] AND [2] SHORTCUT BADGES */}
      <div className="flex items-center justify-between gap-3 pt-2">
        <button onClick={handleUndo} disabled={historyStack.length === 0} className="px-3 py-2 rounded-lg bg-white border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed shadow-xs">
          &#8617; Desfer
        </button>

        <div className="flex items-center gap-2 flex-1 justify-end">
          <button onClick={() => handleNext(true)} className="px-4 py-2 rounded-lg bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 text-xs font-bold transition-all shadow-xs flex items-center gap-1.5">
            <span>Difícil (Repassar)</span>
            <span className="px-1.5 py-0.5 rounded bg-rose-200/80 text-[10px] font-mono">[1]</span>
          </button>

            <span>Ho recordo bé &rarr;</span>

  );
}

// --- 3. WEAKNESSES TRAINER (WITH ACTIVE STUDY MODE, PREV/NEXT, MASTERED & SPACEBAR KEYBOARD FLIP) ---
function WeaknessesTrainer({ session, onNavigate }) {
  const [mistakes, setMistakes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [studyMode, setStudyMode] = useState(false);
  const [studyQueue, setStudyQueue] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);

  const fetchMistakes = async () => {
    if (!supabaseClient || !session?.user?.id) {
      setLoading(false);
      return;
    }
    setLoading(true);
    try {
      const { data, error } = await supabaseClient
        .from('user_mistakes')
        .select('*')
        .eq('user_id', session.user.id)
        .gt('mistake_count', 0)
        .order('mistake_count', { ascending: false });

      if (error) throw error;

      const mapped = (data || []).map(row => {
        const idStr = String(row.word_id);
        const vocab = VOCAB_DATA.find(v => String(v.id) === idStr);
        if (vocab) {
          return { ...row, cat: vocab.cat, eng: vocab.eng, tag: `Vocabulari (${vocab.day})` };
        }
        const verb = VERBS_DATA.find(vb => String(vb.id) === idStr || vb.inf === idStr);
        if (verb) {
          return { ...row, cat: verb.cat, eng: `${verb.inf} - ${verb.past} - ${verb.part}`, tag: `Verb (Grup ${verb.type})` };
        }
        return { ...row, cat: 'Expressió enregistrada', eng: `Ítem #${idStr}`, tag: 'General' };
      });

      setMistakes(mapped);
    } catch (err) {
      console.error(err);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { fetchMistakes(); }, [session]);

  // Start Active Study Mode with shuffled mistakes
  const startStudySession = () => {
    if (mistakes.length === 0) return;
    const shuffled = [...mistakes].sort(() => Math.random() - 0.5);
    setStudyQueue(shuffled);
    setCurrentIndex(0);
    setIsFlipped(false);
    setStudyMode(true);
  };

  // Keyboard shortcut for WeaknessesTrainer: Space flips card when studyMode === true
  useEffect(() => {
    if (!studyMode) return;
    const handleKeyDown = (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setIsFlipped(f => !f);
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [studyMode]);

  // Previous card navigation
  const handlePrevStudyCard = () => {
    if (currentIndex > 0) {
      setIsFlipped(false);
      setCurrentIndex(i => i - 1);
    }
  };

  // Next card navigation
  const handleNextStudyCard = () => {
    setIsFlipped(false);
    if (currentIndex < studyQueue.length - 1) {
      setCurrentIndex(i => i + 1);
    } else {
      if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
      setStudyMode(false);
    }
  };

  // Mark as Mastered: sets mistake_count to 0 in Supabase and removes card from queue
  const handleMarkMastered = async () => {
    const currentCard = studyQueue[currentIndex];
    if (!currentCard) return;

    if (supabaseClient && session?.user?.id) {
      try {
        await supabaseClient
          .from('user_mistakes')
          .update({ mistake_count: 0 })
          .eq('user_id', session.user.id)
          .eq('word_id', currentCard.word_id);
      } catch (err) {
        console.error('Error actualitzant a Supabase:', err);
      }
    }

    const newQueue = studyQueue.filter((_, idx) => idx !== currentIndex);
    setMistakes(prev => prev.filter(m => m.word_id !== currentCard.word_id));
    setStudyQueue(newQueue);
    setIsFlipped(false);

    if (newQueue.length === 0) {
      if (window.confetti) window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
      setStudyMode(false);
    } else {
      setCurrentIndex(prev => Math.min(prev, newQueue.length - 1));
    }
  };

  if (loading) {
    return <div className="text-center py-16 text-slate-500 font-mono text-xs">Carregant els teus errors de Supabase...</div>;
  }

  // --- ACTIVE STUDY MODE 3D VIEW ---
  if (studyMode && studyQueue.length > 0) {
    const currentCard = studyQueue[currentIndex];

    return (
      <div className="space-y-6 max-w-xl mx-auto">
        <div className="flex items-center justify-between text-xs px-1 font-mono">
          <span className="text-oxford-900 font-bold uppercase tracking-wider">🏋️ Entrenant Punts Dèbils</span>
          <button onClick={() => setStudyMode(false)} className="text-slate-500 hover:text-crimson-700 transition-colors font-sans">
            &larr; Tornar a la llista / Sortir
          </button>
        </div>

        <div className="flex items-center justify-between text-xs px-1 font-mono">
          <span className="text-slate-500">Error <strong>{currentIndex + 1}</strong> de {studyQueue.length}</span>
          <span className="text-crimson-700 font-bold bg-crimson-50 px-2.5 py-0.5 rounded border border-crimson-200">
            {currentCard?.mistake_count} errades registrades
          </span>
        </div>

        {/* 3D Flashcard */}
        <div className="w-full h-80 perspective-container cursor-pointer select-none" onClick={() => setIsFlipped(f => !f)}>
          <div className={`card-3d-inner ${isFlipped ? 'flipped' : ''}`}>
            
            {/* FRONT */}
            <div className="card-face bg-white border-2 border-slate-200/90 p-8 flex flex-col justify-between items-center text-center shadow-md hover:border-oxford-300 transition-colors">
              <div className="w-full flex items-center justify-between text-xs text-slate-400 font-mono">
                <span className="uppercase tracking-wider">{currentCard?.tag}</span>
                <span>Anvers (Prem Espai per girar)</span>
              </div>

              <div className="my-auto px-4">
                <p className="text-xs uppercase font-mono tracking-widest text-crimson-700 font-bold mb-2">Com es diu o conjuga en anglès?</p>
                <h3 className="text-xl sm:text-2xl font-serif-academic font-bold text-oxford-950 leading-snug">
                  {currentCard?.cat}
                </h3>
              </div>

              <span className="text-[11px] text-slate-400 font-mono">Espai / Clic per revelar solució &rarr;</span>
            </div>

            {/* BACK */}
            <div className="card-face card-face-back bg-gradient-to-b from-[#001f44] to-[#00152e] text-white p-8 flex flex-col justify-between items-center text-center shadow-lg border-2 border-oxford-800">
              <div className="w-full flex items-center justify-between text-xs text-amber-300/80 font-mono">
                <span className="uppercase tracking-wider">Solució Acadèmica</span>
                <span>Revers</span>
              </div>

              <div className="my-auto px-4">
                <p className="text-xs uppercase font-mono tracking-widest text-amber-300 font-bold mb-2">Anglès Oficial</p>
                <div className="flex items-center justify-center gap-2">
                  <h3 className="text-xl sm:text-2xl font-serif-academic font-bold text-white leading-snug">
                    {currentCard?.eng}
                  </h3>
                  {/* 🔊 Audio pronunciation on back of card */}
                  {currentCard?.eng && (
                    <button
                      type="button"
                      onClick={(e) => speakEnglish(currentCard.eng, e)}
                      className="p-1 rounded hover:bg-white/10 text-amber-300 hover:text-amber-200 transition-colors text-base select-none shrink-0"
                      title="Escoltar pronunciació en anglès britànic"
                    >
                      🔊
                    </button>
                  )}
                </div>
              </div>

              <span className="text-[11px] text-slate-300 font-mono">Revisa el punt feble</span>
            </div>

          </div>
        </div>

        {/* 3 Action Buttons Row: Prev / Ja me la sé / Next */}
        <div className="flex items-center justify-between gap-2 pt-2">
          <button
            onClick={handlePrevStudyCard}
            disabled={currentIndex === 0}
            className="px-3 py-2 rounded-lg bg-white border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed shadow-xs"
          >
            &larr; Anterior
          </button>
          
          <button
            onClick={handleMarkMastered}
            className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition-all shadow-xs flex items-center gap-1.5"
            title="Posa a 0 els errors a Supabase i treu de la cua"
          >
            <span>&check; Ja me la s&eacute;</span>
          </button>

          <button
            onClick={handleNextStudyCard}
            className="px-4 py-2 rounded-lg bg-crimson-700 hover:bg-crimson-800 text-white text-xs font-bold transition-all shadow-xs"
          >
            Seg&uuml;ent &rarr;
          </button>
        </div>
      </div>
    );
  }

  // --- EMPTY STATE ---
  if (mistakes.length === 0) {
    return (
      <div className="rounded-2xl bg-white border border-slate-200 p-12 text-center shadow-sm max-w-lg mx-auto space-y-4">
        <div className="w-20 h-20 rounded-full bg-amber-50 border-2 border-amber-300 text-amber-500 flex items-center justify-center text-4xl mx-auto shadow-inner">
          🏆
        </div>
        <h2 className="text-2xl font-serif-academic font-bold text-oxford-950">
          Excel·lent! No tens cap error registrat actualment.
        </h2>
        <p className="text-xs text-slate-600 leading-relaxed">
          El teu expedient està completament net a Supabase. Continua practicant amb les flashcards o els verbs irregulars per consolidar el temari abans de la prova de PAU.
        </p>
      </div>
    );
  }

  // --- OXFORD BLUE THEMED LIST VIEW ---
  return (
    <div className="space-y-4 max-w-4xl mx-auto">
      {/* Prominent Active Study Mode CTA */}
      <div className="bg-gradient-to-r from-oxford-900 to-[#062c54] text-white p-5 rounded-xl border border-oxford-800 shadow-md flex flex-col sm:flex-row items-center justify-between gap-4">
        <div>
          <h2 className="text-lg font-serif-academic font-bold text-white">Els Meus Punts Febles ({mistakes.length})</h2>
          <p className="text-xs text-slate-300 font-sans mt-0.5">Elements que requereixen atenció segons el teu expedient de Supabase.</p>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={startStudySession} className="px-5 py-2.5 rounded-lg bg-crimson-700 hover:bg-crimson-800 text-white font-bold text-xs tracking-wide transition-all shadow-sm flex items-center gap-2">
            <span>🏋️ Entrenar Punts Dèbils</span>
          </button>
          <button onClick={fetchMistakes} className="px-3 py-2.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold" title="Actualitzar">
            🔄
          </button>
        </div>
      </div>

      <div className="space-y-3">
        {mistakes.map((m, idx) => (
          <div key={idx} className="bg-white border border-slate-200 p-4 rounded-xl flex items-center justify-between shadow-xs hover:border-slate-300 transition-all">
            <div className="min-w-0 pr-4">
              <span className="text-[10px] font-mono uppercase font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">{m.tag}</span>
              <div className="flex items-center gap-2 mt-1">
                <h3 className="text-base font-serif-academic font-bold text-oxford-950 truncate">{m.eng}</h3>
                {m.eng && (
                  <button
                    type="button"
                    onClick={(e) => speakEnglish(m.eng, e)}
                    className="text-slate-400 hover:text-crimson-700 transition-colors p-0.5 rounded text-xs select-none"
                    title="Escoltar pronunciació"
                  >
                    🔊
                  </button>
                )}
              </div>
              <p className="text-xs text-slate-500 truncate">{m.cat}</p>
            </div>
            <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-crimson-50 border border-crimson-200 text-crimson-800 font-mono text-xs font-bold whitespace-nowrap">
              {m.mistake_count} {m.mistake_count === 1 ? 'error' : 'errors'}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// --- 4. AUTH WRAPPER (AuthApp & AuthView) ---
function AuthApp() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!supabaseClient) { setLoading(false); return; }
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      setLoading(false);
    });
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      setSession(session);
    });
    return () => subscription.unsubscribe();
  }, []);

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center font-mono text-xs text-oxford-900">Iniciant JP ENGLISH HUB...</div>;
  }

  if (!session) {
    return <AuthView onAuthSuccess={(s) => setSession(s)} />;
  }

  return <App session={session} userEmail={session?.user?.email} onLogout={() => supabaseClient.auth.signOut()} />;
}

      <h1 className="text-2xl font-serif-academic font-bold text-oxford-950 mb-1">JP ENGLISH HUB</h1>
      <p className="text-xs uppercase font-mono tracking-widest text-crimson-700 font-bold mb-6">Plataforma Acadèmica Batxillerat &bull; PAU</p>

      <div className="max-w-md w-full bg-white rounded-2xl border border-slate-200/90 shadow-md overflow-hidden">
        <div className="grid grid-cols-2 border-b border-slate-100 text-xs font-semibold">
          <button onClick={() => setAuthMode('login')} className={`py-3 text-center transition-all ${authMode === 'login' ? 'border-b-2 border-crimson-700 text-oxford-950 font-bold' : 'text-slate-500 hover:text-slate-800'}`}>Iniciar Sessió</button>
          <button onClick={() => setAuthMode('register')} className={`py-3 text-center transition-all ${authMode === 'register' ? 'border-b-2 border-crimson-700 text-oxford-950 font-bold' : 'text-slate-500 hover:text-slate-800'}`}>Crear Compte</button>
        </div>

        <form onSubmit={handleAuth} className="p-6 space-y-4">
          {errorMsg && <div className="p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">{errorMsg}</div>}
          <div>
            <label className="block text-[11px] font-mono font-bold uppercase tracking-wider text-slate-600 mb-1">Correu Electrònic</label>
            <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="alumne@institut.cat" className="w-full px-3 py-2 rounded-lg border border-slate-200 text-xs font-sans focus:border-oxford-900 focus:ring-0" />
          </div>
          <div>
            <label className="block text-[11px] font-mono font-bold uppercase tracking-wider text-slate-600 mb-1">Contrasenya</label>
            <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" className="w-full px-3 py-2 rounded-lg border border-slate-200 text-xs font-sans focus:border-oxford-900 focus:ring-0" />
          </div>
          <button type="submit" className="w-full py-2.5 rounded-lg bg-oxford-900 hover:bg-oxford-800 text-white font-bold text-xs tracking-wide transition-all shadow-sm">
            {authMode === 'login' ? 'Entrar a la Plataforma &rarr;' : 'Completar Registre &rarr;'}
          </button>
        </form>

        <div className="bg-slate-50 p-3 border-t border-slate-100 text-center text-[11px] text-slate-500">
          Seguretat d'accés gestionada oficialment amb Supabase.
        </div>
      </div>

      <p className="text-[11px] text-slate-400 mt-6 font-mono">JP ENGLISH HUB &bull; Desenvolupat per <strong className="text-crimson-700">JanPick</strong></p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AuthApp />);
</script>
</body>
</html>
