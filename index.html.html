function cleanStr(s) {
  return (s || '').toLowerCase().trim().replace(/[.,/#!$%^&*;:{}=\-_`~()?"']/g, "").replace(/\s+/g, ' ');
}

function checkVerbMatch(userVal, correctVal, altVal) {
  if (!userVal) return false;
  const cleanUser = userVal.toLowerCase().trim();
  const cleanCorrect = (correctVal || "").toLowerCase().trim();
  const cleanAlt = (altVal || "").toLowerCase().trim();
  return cleanUser === cleanCorrect || (cleanAlt && cleanUser === cleanAlt);
}

function checkMeaningMatch(userVal, meaningStr) {
  if (!userVal || !meaningStr) return false;
  const u = cleanStr(userVal);
  if (!u || u.length < 2) return false;
  const parts = meaningStr.split(/[,/]/).map(cleanStr);
  return parts.some(p => p === u);
}

// --- RESTORED VERBS TRAINER ---
function VerbsTrainer({ onCompleteAction }) {
  const [selectedGroup, setSelectedGroup] = useState('ALL'); 
  const [mode, setMode] = useState('fill'); 
  const [direction, setDirection] = useState('eng_to_cat'); 
  const [verbsList, setVerbsList] = useState(VERBS_DATA);
  
  const [inputs, setInputs] = useState(() => {
    try { const saved = localStorage.getItem('esh_verbs_answers'); return saved ? JSON.parse(saved) : {}; } catch (e) { return {}; }
  });
  const [revealed, setRevealed] = useState(() => {
    try { const saved = localStorage.getItem('esh_verbs_revealed'); return saved ? JSON.parse(saved) : {}; } catch (e) { return {}; }
  });

  const pastRefs = useRef({});
  const partRefs = useRef({});
  const meaningRefs = useRef({});

  useEffect(() => { try { localStorage.setItem('esh_verbs_answers', JSON.stringify(inputs)); } catch (e) {} }, [inputs]);
  useEffect(() => { try { localStorage.setItem('esh_verbs_revealed', JSON.stringify(revealed)); } catch (e) {} }, [revealed]);

  const filteredVerbs = useMemo(() => {
    if (selectedGroup === 'ALL') return verbsList;
    return verbsList.filter(v => v.type === selectedGroup);
  }, [verbsList, selectedGroup]);

  const handleReset = () => {
    if (window.confirm("Vols reiniciar tots els camps i esborrar el progrés guardat dels verbs?")) {
      setInputs({}); setRevealed({});
      try { localStorage.removeItem('esh_verbs_answers'); localStorage.removeItem('esh_verbs_revealed'); } catch (e) {}
    }
  };

  const handleShuffle = () => { setVerbsList([...verbsList].sort(() => Math.random() - 0.5)); };

  const handlePastChange = (verbId, val, verbObj, index) => {
    setInputs(prev => ({ ...prev, [verbId]: { ...(prev[verbId] || {}), past: val } }));
    if (checkVerbMatch(val, verbObj.past, verbObj.altPast)) {
      if (partRefs.current[verbId]) partRefs.current[verbId].focus();
    }
  };

  const handlePartChange = (verbId, val, verbObj, index) => {
    setInputs(prev => ({ ...prev, [verbId]: { ...(prev[verbId] || {}), part: val } }));
    if (checkVerbMatch(val, verbObj.part, verbObj.altPart)) {
      const nextVerb = filteredVerbs[index + 1];
      if (nextVerb && pastRefs.current[nextVerb.id]) pastRefs.current[nextVerb.id].focus();
      if (onCompleteAction) onCompleteAction();
    }
  };

  const handleMeaningChange = (verbId, val, verbObj, index) => {
    setInputs(prev => ({ ...prev, [verbId]: { ...(prev[verbId] || {}), meaning: val } }));
    const isCorrect = direction === 'eng_to_cat' ? checkMeaningMatch(val, verbObj.cat) : checkVerbMatch(val, verbObj.inf);
    if (isCorrect) {
      const nextVerb = filteredVerbs[index + 1];
      if (nextVerb && meaningRefs.current[nextVerb.id]) meaningRefs.current[nextVerb.id].focus();
      if (onCompleteAction) onCompleteAction();
    }
  };

  const toggleReveal = (verbId) => { setRevealed(prev => ({ ...prev, [verbId]: !prev[verbId] })); };

  return (
    <div className="space-y-6 max-w-5xl mx-auto">
      <div className="rounded-xl bg-white border border-slate-200/90 p-5 shadow-sm space-y-4">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
          <div>
            <span className="text-[11px] font-mono font-bold tracking-wider text-crimson-700 uppercase bg-crimson-50 px-2 py-0.5 rounded border border-crimson-100">Llista Vertical Completa</span>
            <h1 className="text-xl sm:text-2xl font-serif-academic font-bold text-oxford-950 mt-1">Entrenador de Verbs Irregulars</h1>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={handleReset} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold tracking-wide border border-slate-200 transition-all flex items-center gap-1.5"><span>🔄</span> Reiniciar</button>
            <button onClick={handleShuffle} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold tracking-wide border border-slate-200 transition-all flex items-center gap-1.5"><span>🔀</span> Barrejar</button>
          </div>
        </div>
        <div className="flex flex-wrap items-center justify-between gap-3 pt-1 text-xs">
          <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg border border-slate-200/80">
            {['ALL', 'AAA', 'ABA', 'ABB', 'ABC'].map(grp => (
              <button key={grp} onClick={() => setSelectedGroup(grp)} className={`px-3 py-1.5 rounded font-mono font-bold transition-all ${selectedGroup === grp ? 'bg-oxford-900 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>{grp === 'ALL' ? 'Tots (162)' : grp}</button>
            ))}
          </div>
          <div className="flex items-center gap-2">
            <div className="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200/80 font-semibold">
              <button onClick={() => setMode('fill')} className={`px-3 py-1.5 rounded transition-all ${mode === 'fill' ? 'bg-crimson-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>Formes (Past &amp; Part)</button>
              <button onClick={() => setMode('trans')} className={`px-3 py-1.5 rounded transition-all ${mode === 'trans' ? 'bg-crimson-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>Traducció</button>
            </div>
            {mode === 'trans' && (
              <button onClick={() => setDirection(d => d === 'eng_to_cat' ? 'cat_to_eng' : 'eng_to_cat')} className="px-2.5 py-1.5 rounded-lg bg-amber-50 text-amber-900 border border-amber-200 font-mono text-[11px] font-bold hover:bg-amber-100 transition-all">{direction === 'eng_to_cat' ? 'Anglès ➔ Català' : 'Català ➔ Anglès'}</button>
            )}
          </div>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200/90 shadow-sm overflow-hidden">
        <div className="grid grid-cols-12 bg-slate-50 border-b border-slate-200 px-4 py-3 text-[11px] font-mono font-bold uppercase tracking-wider text-slate-500">
          <div className="col-span-1">#</div>
          <div className="col-span-3 sm:col-span-3">Infinitiu</div>
          {mode === 'fill' ? (
            <>
              <div className="col-span-3">Past Simple</div>
              <div className="col-span-3">Past Participle</div>
              <div className="col-span-2 text-right">Significat</div>
            </>
          ) : (
            <>
              <div className="col-span-6">{direction === 'eng_to_cat' ? 'Traducció al Català' : 'Infinitiu en Anglès'}</div>
              <div className="col-span-2 text-right">Solució</div>
            </>
          )}
        </div>
        <div className="divide-y divide-slate-100 max-h-[680px] overflow-y-auto">
          {filteredVerbs.map((verb, idx) => {
            const verbInputs = inputs[verb.id] || {};
            const isPastCorrect = checkVerbMatch(verbInputs.past, verb.past, verb.altPast);
            const isPartCorrect = checkVerbMatch(verbInputs.part, verb.part, verb.altPart);
            const isMeaningCorrect = direction === 'eng_to_cat' ? checkMeaningMatch(verbInputs.meaning, verb.cat) : checkVerbMatch(verbInputs.meaning, verb.inf);
            const isRev = revealed[verb.id];

            return (
              <div key={verb.id} className="grid grid-cols-12 items-center px-4 py-3 hover:bg-slate-50/70 transition-colors gap-2 text-sm">
                <div className="col-span-1 font-mono text-xs text-slate-400">{idx + 1}</div>
                <div className="col-span-3 sm:col-span-3 flex flex-col">
                  <span className="font-bold text-oxford-950 font-serif-academic text-base">{mode === 'trans' && direction === 'cat_to_eng' ? verb.cat : verb.inf}</span>
                  <span className="text-[10px] font-mono text-slate-400 uppercase">Grup {verb.type}</span>
                </div>
                {mode === 'fill' ? (
                  <>
                    <div className="col-span-3">
                      <input ref={el => pastRefs.current[verb.id] = el} type="text" value={verbInputs.past || ''} onChange={e => handlePastChange(verb.id, e.target.value, verb, idx)} placeholder={isRev ? (verb.altPast ? `${verb.past} / ${verb.altPast}` : verb.past) : 'past simple...'} className={`w-full px-3 py-1.5 rounded-lg border text-xs sm:text-sm font-mono transition-all focus:outline-none focus:ring-1 ${isPastCorrect ? 'bg-emerald-50 border-emerald-400 text-emerald-900 focus:ring-emerald-500 font-bold' : 'bg-white border-slate-300 text-slate-800 focus:border-oxford-700 focus:ring-oxford-700'}`} />
                    </div>
                    <div className="col-span-3">
                      <input ref={el => partRefs.current[verb.id] = el} type="text" value={verbInputs.part || ''} onChange={e => handlePartChange(verb.id, e.target.value, verb, idx)} placeholder={isRev ? (verb.altPart ? `${verb.part} / ${verb.altPart}` : verb.part) : 'past participle...'} className={`w-full px-3 py-1.5 rounded-lg border text-xs sm:text-sm font-mono transition-all focus:outline-none focus:ring-1 ${isPartCorrect ? 'bg-emerald-50 border-emerald-400 text-emerald-900 focus:ring-emerald-500 font-bold' : 'bg-white border-slate-300 text-slate-800 focus:border-oxford-700 focus:ring-oxford-700'}`} />
                    </div>
                    <div className="col-span-2 text-right"><span className="text-xs text-slate-600 block truncate" title={verb.cat}>{verb.cat}</span></div>
                  </>
                ) : (
                  <>
                    <div className="col-span-6">
                      <input ref={el => meaningRefs.current[verb.id] = el} type="text" value={verbInputs.meaning || ''} onChange={e => handleMeaningChange(verb.id, e.target.value, verb, idx)} placeholder={isRev ? (direction === 'eng_to_cat' ? verb.cat : verb.inf) : (direction === 'eng_to_cat' ? 'Escriu el significat...' : 'Escriu l\'infinitiu...')} className={`w-full px-3 py-1.5 rounded-lg border text-xs sm:text-sm font-mono transition-all focus:outline-none focus:ring-1 ${isMeaningCorrect ? 'bg-emerald-50 border-emerald-400 text-emerald-900 focus:ring-emerald-500 font-bold' : 'bg-white border-slate-300 text-slate-800 focus:border-oxford-700 focus:ring-oxford-700'}`} />
                    </div>
                    <div className="col-span-2 text-right"><button onClick={() => toggleReveal(verb.id)} className="text-[11px] font-mono text-slate-400 hover:text-oxford-800 underline transition-colors">{isRev ? 'Ocultar' : 'Pista'}</button></div>
                  </>
                )}
              </div>
            );
          })}
        </div>
        <div className="bg-slate-50 border-t border-slate-200 px-4 py-3 flex items-center justify-between text-xs text-slate-500 font-mono">
          <span>Mostrant {filteredVerbs.length} verbs irregulars</span>
          <span>Hyper-Flow: Salt automàtic en encertar la forma correcta</span>
        </div>
      </div>
    </div>
  );
}

    try {
      const savedQueue = localStorage.getItem(`esh_vocab_queue_${selectedDay}`);
      const savedMastered = localStorage.getItem(`esh_vocab_mastered_${selectedDay}`);
      const savedHistory = localStorage.getItem(`esh_vocab_history_${selectedDay}`);
      const defaultDayItems = VOCAB_DATA.filter(item => item.day === selectedDay);
      if (savedQueue !== null && savedMastered !== null) {
        setQueue(JSON.parse(savedQueue)); setMastered(JSON.parse(savedMastered)); setHistoryStack(savedHistory ? JSON.parse(savedHistory) : []);
      } else {
        setQueue(defaultDayItems); setMastered([]); setHistoryStack([]);
      }
    } catch (e) {
      const defaultDayItems = VOCAB_DATA.filter(item => item.day === selectedDay);
      setQueue(defaultDayItems); setMastered([]); setHistoryStack([]);
    }
    setIsFlipped(false);
  }, [selectedDay]);

  useEffect(() => {
    try {
      localStorage.setItem(`esh_vocab_queue_${selectedDay}`, JSON.stringify(queue));
      localStorage.setItem(`esh_vocab_mastered_${selectedDay}`, JSON.stringify(mastered));
      localStorage.setItem(`esh_vocab_history_${selectedDay}`, JSON.stringify(historyStack));
    } catch (e) {}
  }, [queue, mastered, historyStack, selectedDay]);

  const currentCard = queue[0] || null;

  const handleResetSession = () => {
    if (window.confirm("Vols reiniciar la sessió d'estudi del dia seleccionat? S'esborrarà el progrés d'aquesta ronda.")) {
      const dayItems = VOCAB_DATA.filter(item => item.day === selectedDay);
      setQueue(dayItems); setMastered([]); setHistoryStack([]); setIsFlipped(false);
      try { localStorage.removeItem(`esh_vocab_queue_${selectedDay}`); localStorage.removeItem(`esh_vocab_mastered_${selectedDay}`); localStorage.removeItem(`esh_vocab_history_${selectedDay}`); } catch (e) {}
    }
  };

  const handleHard = async () => {
    if (!currentCard) return;
    if (session && session.user && supabaseClient && currentCard) {
      setSyncStatus('saving');
      try {
        const userId = session.user.id; const wordId = String(currentCard.id);
        const { data, error: selectError } = await supabaseClient.from('user_mistakes').select('mistake_count').eq('user_id', userId).eq('word_id', wordId).maybeSingle();
        if (selectError) throw selectError;
        if (data) {
          const { error: updateError } = await supabaseClient.from('user_mistakes').update({ mistake_count: (data.mistake_count || 1) + 1 }).eq('user_id', userId).eq('word_id', wordId);
          if (updateError) throw updateError;
        } else {
          const { error: insertError } = await supabaseClient.from('user_mistakes').insert({ user_id: userId, word_id: wordId, mistake_count: 1 });
          if (insertError) throw insertError;
        }
        setSyncStatus('saved'); setTimeout(() => setSyncStatus(''), 2000);
      } catch (err) { setSyncStatus('error'); setTimeout(() => setSyncStatus(''), 3000); }
    }
    setHistoryStack(prev => [...prev, { card: currentCard, action: 'hard' }]);
    setIsFlipped(false);
    setQueue(prev => { const rest = prev.slice(1); return [...rest, currentCard]; });
  };

  const handleEasy = () => {
    if (!currentCard) return;
    setHistoryStack(prev => [...prev, { card: currentCard, action: 'easy' }]);
    setIsFlipped(false); setMastered(prev => [...prev, currentCard]); setQueue(prev => prev.slice(1));
    if (onCompleteAction) onCompleteAction();
  };

  const handleUndo = () => {
    if (historyStack.length === 0) return;
    const last = historyStack[historyStack.length - 1];
    setHistoryStack(prev => prev.slice(0, prev.length - 1)); setIsFlipped(false);
    if (last.action === 'easy') {
      setMastered(prev => prev.filter(c => c.id !== last.card.id)); setQueue(prev => [last.card, ...prev]);
    } else {
      setQueue(prev => { const without = prev.filter(c => c.id !== last.card.id); return [last.card, ...without]; });
    }
  };

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); setIsFlipped(f => !f); }
      else if (e.key === '1') { e.preventDefault(); handleHard(); }
      else if (e.key === '2') { e.preventDefault(); handleEasy(); }
    };
    window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown);
  }, [currentCard, isFlipped, historyStack]);

  const total = queue.length + mastered.length;
  const progressPercent = total > 0 ? Math.round((mastered.length / total) * 100) : 100;

  return (
    <div className="space-y-6 max-w-2xl mx-auto">
      <div className="rounded-xl bg-white border border-slate-200/90 p-5 shadow-sm space-y-4">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
          <div>
            <span className="text-[11px] font-mono font-bold tracking-wider text-crimson-700 uppercase bg-crimson-50 px-2 py-0.5 rounded border border-crimson-100">Safe Active Recall 3D</span>
            <h1 className="text-xl sm:text-2xl font-serif-academic font-bold text-oxford-950 mt-1">Vocabulari &amp; Expressions Clau</h1>
          </div>
          <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg border border-slate-200/80 text-xs font-semibold">
            {['Dilluns', 'Dimarts', 'Divendres'].map(day => (
              <button key={day} onClick={() => setSelectedDay(day)} className={`px-3 py-1.5 rounded transition-all ${selectedDay === day ? 'bg-oxford-900 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900'}`}>{day}</button>
            ))}
          </div>
        </div>
        <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
          <div className="flex items-center gap-2">
            <button onClick={() => setDirection(d => d === 'eng_to_cat' ? 'cat_to_eng' : 'eng_to_cat')} className="px-3 py-1.5 rounded-lg bg-amber-50 text-amber-900 border border-amber-200 font-mono text-[11px] font-bold hover:bg-amber-100 transition-all">{direction === 'eng_to_cat' ? 'Anglès ➔ Català' : 'Català ➔ Anglès'}</button>
            {syncStatus === 'saving' && <span className="text-[11px] text-amber-600 font-mono flex items-center gap-1"><span className="animate-spin">🔄</span> Guardant error...</span>}
            {syncStatus === 'saved' && <span className="text-[11px] text-emerald-600 font-mono font-bold flex items-center gap-1">✓ Error sincronitzat</span>}
          </div>
          <div className="flex items-center gap-2">
            <button onClick={handleUndo} disabled={historyStack.length === 0} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 font-semibold transition-all disabled:opacity-40 disabled:pointer-events-none" title="Desfer la darrera acció">Desfer</button>
            <button onClick={handleResetSession} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 font-semibold transition-all flex items-center gap-1.5" title="Reiniciar la sessió d'aquest dia"><span>🔄</span> Reiniciar Sessió</button>
          </div>
        </div>
        <div className="space-y-1.5 pt-1">
          <div className="flex items-center justify-between text-xs font-mono text-slate-500">
            <span>Memoritzades: <strong>{mastered.length}</strong> / {total}</span>
            <span>{progressPercent}% completat</span>
          </div>
          <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden border border-slate-200/80">
            <div className="bg-gradient-to-r from-oxford-800 to-crimson-700 h-full rounded-full transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
          </div>
        </div>
      </div>
      
      {currentCard ? (
        <div className="space-y-6">
          <div onClick={() => setIsFlipped(!isFlipped)} className="perspective-container w-full h-80 sm:h-96 cursor-pointer select-none">
            <div className={`card-3d-inner shadow-lg hover:shadow-xl transition-shadow ${isFlipped ? 'flipped' : ''}`}>
              {/* BUG FIX: studyDirection replaced with direction below */}
              <div className="card-face bg-white border-2 border-slate-200/90 p-8 flex flex-col justify-between hover:border-oxford-700 transition-colors">
                <div className="flex items-center justify-between"><span className="text-xs uppercase font-mono tracking-widest text-slate-400 font-bold">Anvers &bull; {direction === 'cat_to_eng' ? 'Català' : 'English'}</span><span className="text-xs font-mono px-2 py-0.5 rounded bg-slate-100 text-slate-600">Prem Espai per girar</span></div>
                <div className="my-auto text-center px-4"><p className="text-xl sm:text-2xl font-serif-academic font-bold text-oxford-950 leading-relaxed">{direction === 'cat_to_eng' ? currentCard.cat : currentCard.eng}</p></div>
                <div className="text-center pt-4 border-t border-slate-100 text-xs text-slate-400 font-mono">Fes clic a la targeta o prem [Espai] per veure el revers &bull; Safe Active Recall</div>
              </div>
              <div className="card-face card-face-back bg-gradient-to-b from-[#002147] to-[#00152e] text-white border-2 border-crimson-700 p-8 flex flex-col justify-between">
                <div className="flex items-center justify-between"><span className="text-xs uppercase font-mono tracking-widest text-amber-300 font-bold">Revers &bull; {direction === 'cat_to_eng' ? 'English' : 'Català'}</span><span className="text-xs font-mono text-white/70 bg-white/10 px-2 py-0.5 rounded border border-white/20">Solució Oficial</span></div>
                <div className="my-auto text-center px-4"><p className="text-xl sm:text-2xl font-serif-academic font-bold text-white leading-relaxed">{direction === 'cat_to_eng' ? currentCard.eng : currentCard.cat}</p></div>
                <div className="text-center pt-4 border-t border-white/10 text-xs text-slate-300 font-mono">Avalua el teu record: 1 = Difícil | 2 = Fàcil</div>
              </div>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <button onClick={handleHard} className="py-3 px-4 rounded-xl bg-white border border-rose-200 text-rose-700 font-bold hover:bg-rose-50 hover:border-rose-300 shadow-sm transition-all flex flex-col items-center justify-center gap-0.5"><span className="text-sm font-semibold">Difícil (Repetir)</span><span className="text-[10px] font-mono text-rose-400">Tecla 1 &bull; Registra a Supabase</span></button>
            <button onClick={handleEasy} className="py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-700 text-white font-bold hover:from-emerald-700 hover:to-teal-800 shadow-md transition-all flex flex-col items-center justify-center gap-0.5"><span className="text-sm font-semibold">Fàcil (Memoritzat)</span><span className="text-[10px] font-mono text-emerald-100">Tecla 2</span></button>
          </div>
        </div>
      ) : (
        <div className="rounded-xl bg-white border border-slate-200/90 p-8 text-center shadow-sm space-y-4">
          <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl mx-auto">✓</div>
          <h2 className="text-2xl font-serif-academic font-bold text-oxford-950">Sessió de {selectedDay} Completada!</h2>

        </div>
      )}
    </div>
  );
}

// --- NEW COMPONENT (FASE 4): WEAKNESSES TRAINER (MY MISTAKES DASHBOARD) ---
function WeaknessesTrainer({ session }) {
  const [mistakesList, setMistakesList] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const fetchWeaknesses = async () => {
      if (session?.user?.id && supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('user_mistakes')
            .select('*')
            .eq('user_id', session.user.id)
            .gt('mistake_count', 0)
            .order('mistake_count', { ascending: false });
          
          if (error) throw error;
          
          if (data) {
            const enriched = data.map(record => {
              const vocabMatch = VOCAB_DATA.find(item => String(item.id) === String(record.word_id));
              if (vocabMatch) return { ...record, ...vocabMatch, source: 'vocab' };
              const verbMatch = VERBS_DATA.find(item => String(item.id) === String(record.word_id) || item.inf === record.word_id);
              if (verbMatch) return { ...record, ...verbMatch, source: 'verb' };
              return record;
            }).filter(r => r.source);

            setMistakesList(enriched);
          }
        } catch (err) {
          console.error("Error fetching weaknesses:", err);
        } finally {
          setLoading(false);
        }
      } else {
        setLoading(false);
      }
    };
    fetchWeaknesses();
  }, [session]);

  if (loading) return <div className="text-center py-20 font-mono text-slate-400">Analitzant expedient acadèmic a Supabase...</div>;

  return (
    <div className="max-w-4xl mx-auto space-y-6">
      <div className="bg-gradient-to-r from-oxford-950 to-oxford-900 rounded-xl p-8 text-white shadow-md relative overflow-hidden">
        <div className="relative z-10">
          <span className="text-[11px] font-mono font-bold tracking-wider text-amber-400 uppercase bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20 mb-3 inline-block">
            Algoritme d'Aprenentatge Adaptatiu
          </span>
          <h1 className="text-3xl font-serif-academic font-bold text-white mt-1">
            Els Meus Punts Dèbils
          </h1>
          <p className="text-sm text-slate-300 mt-2 max-w-2xl">
            Aquesta llista es genera automàticament a partir de les teves interaccions. Prioritza l'estudi de les expressions que el sistema ha detectat que et costen més.
          </p>
        </div>
        <div className="absolute -right-8 -bottom-16 opacity-10 text-9xl">🧠</div>
      </div>

      {mistakesList.length === 0 ? (
        <div className="bg-white rounded-xl border border-emerald-200 p-12 text-center shadow-sm">
          <div className="text-6xl mb-4">🏆</div>
          <h2 className="text-2xl font-serif-academic font-bold text-oxford-950 mb-2">Excel·lent! No tens cap error registrat actualment.</h2>
          <p className="text-slate-600 max-w-md mx-auto">
            El teu expedient està completament net a la base de dades. Continua entrenant per registrar nous punts febles.
          </p>
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200/90 shadow-sm overflow-hidden">
          <div className="grid grid-cols-12 bg-slate-50 border-b border-slate-200 px-6 py-4 text-[11px] font-mono font-bold uppercase tracking-wider text-slate-500">
            <div className="col-span-1">Errades</div>
            <div className="col-span-5">Conceptes Acadèmics (PAU)</div>
            <div className="col-span-4">Traducció</div>
            <div className="col-span-2 text-right">Mòdul</div>
          </div>
          <div className="divide-y divide-slate-100 max-h-[600px] overflow-y-auto">
            {mistakesList.map((item) => (
              <div key={item.word_id} className="grid grid-cols-12 items-center px-6 py-4 hover:bg-slate-50/50 transition-colors">
                <div className="col-span-1">
                  <span className="inline-flex items-center justify-center w-8 h-8 rounded-full bg-crimson-50 text-crimson-700 font-bold border border-crimson-100 shadow-sm">
                    {item.mistake_count}
                  </span>
                </div>
                <div className="col-span-5 pr-4">
                  <p className="font-bold text-oxford-950 font-serif-academic text-base">
                    {item.source === 'vocab' ? item.eng : item.inf}
                  </p>
                  {item.source === 'verb' && (
                    <p className="text-[10px] font-mono text-slate-400 mt-0.5">Past: {item.past} / Part: {item.part}</p>
                  )}
                </div>
                <div className="col-span-4 pr-4">
                  <p className="text-sm text-slate-600">{item.cat}</p>
                </div>
                <div className="col-span-2 text-right">
                  <span className={`text-[10px] font-mono font-bold px-2.5 py-1 rounded border ${
                    item.source === 'vocab' ? 'bg-amber-50 text-amber-800 border-amber-200' : 'bg-oxford-50 text-oxford-800 border-oxford-200'
                  }`}>
                    {item.source === 'vocab' ? `Vocab (${item.day})` : `Verb (${item.type})`}
                  </span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// --- AUTHAPP COMPONENT ---
function AuthApp() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!supabaseClient) { setLoading(false); return; }
    supabaseClient.auth.getSession().then(({ data: { session } }) => { setSession(session); setLoading(false); });
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => { setSession(session); setLoading(false); });
    return () => subscription.unsubscribe();
  }, []);

  if (loading) return <div className="min-h-screen bg-[#002147] flex flex-col items-center justify-center text-white"><div className="w-10 h-10 rounded-full border-4 border-amber-400 border-t-transparent animate-spin mb-3"></div><p className="font-serif-academic text-sm tracking-wide text-amber-200">Verificant credencials d'accés a l'acadèmia...</p></div>;
  if (!session) return <AuthView onAuthSuccess={(sess) => setSession(sess)} />;
  return <App session={session} userEmail={session.user.email} onLogout={() => supabaseClient.auth.signOut()} />;
}

// --- REACT MOUNTING ---
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AuthApp />);
</script>
</body>
</html>
