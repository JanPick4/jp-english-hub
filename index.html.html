function cleanStr(s) {
  return (s || '').toLowerCase().trim().replace(/[.,/#!$%^&*;:{}=\-_`~()?"']/g, "").replace(/\s+/g, ' ');
}

function checkVerbMatch(userVal, correctVal, altVal) {
  if (!userVal) return false;
  const cleanUser = userVal.toLowerCase().trim();
  const cleanCorrect = (correctVal || "").toLowerCase().trim();
  const cleanAlt = (altVal || "").toLowerCase().trim();
  return cleanUser === cleanCorrect || (cleanAlt && cleanUser === cleanAlt);
}

function checkMeaningMatch(userVal, meaningStr) {
  if (!userVal || !meaningStr) return false;
  const u = cleanStr(userVal);
  if (!u || u.length < 2) return false;
  const parts = meaningStr.split(/[,/]/).map(cleanStr);
  return parts.some(p => p === u);
}

// --- 2. VERBS TRAINER (VERTICAL LIST, HYPER-FLOW, PERSISTENCE) ---
function VerbsTrainer({ onCompleteAction }) {
  const [selectedType, setSelectedType] = useState('ALL');
  const [searchQuery, setSearchQuery] = useState('');
  const [mode, setMode] = useState('pastPart'); // 'pastPart' | 'trans'
  const [answers, setAnswers] = useState(() => {
    try {
      const saved = localStorage.getItem('esh_verbs_answers');
      return saved ? JSON.parse(saved) : {};
    } catch(e) { return {}; }
  });
  const [revealed, setRevealed] = useState(() => {
    try {
      const saved = localStorage.getItem('esh_verbs_revealed');
      return saved ? JSON.parse(saved) : {};
    } catch(e) { return {}; }
  });

  const inputsRef = useRef({});

  useEffect(() => {
    try {
      localStorage.setItem('esh_verbs_answers', JSON.stringify(answers));
    } catch (e) {}
  }, [answers]);

  useEffect(() => {
    try {
      localStorage.setItem('esh_verbs_revealed', JSON.stringify(revealed));
    } catch (e) {}
  }, [revealed]);

  const filteredVerbs = useMemo(() => {
    return VERBS_DATA.filter(verb => {
      const matchesType = selectedType === 'ALL' || verb.type === selectedType;
      const matchesSearch = searchQuery === '' || 
        verb.inf.toLowerCase().includes(searchQuery.toLowerCase()) || 
        verb.cat.toLowerCase().includes(searchQuery.toLowerCase());
      return matchesType && matchesSearch;
    });
  }, [selectedType, searchQuery]);

  const handleInputChange = (verbId, field, val) => {
    const updated = {
      ...answers,
      [verbId]: {
        ...(answers[verbId] || {}),
        [field]: val
      }
    };
    setAnswers(updated);

    const verb = VERBS_DATA.find(v => v.id === verbId);
    if (!verb) return;

    if (mode === 'pastPart') {
      if (field === 'past' && checkVerbMatch(val, verb.past, verb.altPast)) {
        if (inputsRef.current[`${verbId}_part`]) {
          inputsRef.current[`${verbId}_part`].focus();
        }
      } else if (field === 'part' && checkVerbMatch(val, verb.part, verb.altPart)) {
        const curIdx = filteredVerbs.findIndex(v => v.id === verbId);
        if (curIdx !== -1 && curIdx < filteredVerbs.length - 1) {
          const nextVerb = filteredVerbs[curIdx + 1];
          if (inputsRef.current[`${nextVerb.id}_past`]) {
            inputsRef.current[`${nextVerb.id}_past`].focus();
          }
        }
        if (onCompleteAction) onCompleteAction();
      }
    } else if (mode === 'trans') {
      if (field === 'trans' && checkMeaningMatch(val, verb.cat)) {
        const curIdx = filteredVerbs.findIndex(v => v.id === verbId);
        if (curIdx !== -1 && curIdx < filteredVerbs.length - 1) {
          const nextVerb = filteredVerbs[curIdx + 1];
          if (inputsRef.current[`${nextVerb.id}_trans`]) {
            inputsRef.current[`${nextVerb.id}_trans`].focus();
          }
        }
        if (onCompleteAction) onCompleteAction();
      }
    }
  };

  const handleResetAll = () => {
    if (confirm("Segur que vols reiniciar tot el progrés dels Verbs Irregulars? S'esborraran les respostes introduïdes.")) {
      setAnswers({});
      setRevealed({});
      try {
        localStorage.removeItem('esh_verbs_answers');
        localStorage.removeItem('esh_verbs_revealed');
      } catch(e) {}
    }
  };

  const toggleReveal = (verbId) => {
    setRevealed(prev => ({
      ...prev,
      [verbId]: !prev[verbId]
    }));
  };

  return (
    <div className="space-y-6 max-w-4xl mx-auto">
      <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h2 className="text-xl font-serif-academic font-bold text-oxford-950">Entrenador de Verbs Irregulars</h2>
          <p className="text-xs text-slate-500 font-sans mt-0.5">162 Verbs amb validació automàtica i salt intel·ligent Hyper-Flow.</p>
        </div>

        <div className="flex flex-wrap items-center gap-2">
          <div className="flex bg-slate-100 p-1 rounded-lg text-xs font-semibold">
            <button onClick={() => setMode('pastPart')} className={`px-3 py-1 rounded transition-all ${mode === 'pastPart' ? 'bg-oxford-900 text-white shadow-xs' : 'text-slate-600 hover:text-oxford-950'}`}>Past & Part</button>
            <button onClick={() => setMode('trans')} className={`px-3 py-1 rounded transition-all ${mode === 'trans' ? 'bg-oxford-900 text-white shadow-xs' : 'text-slate-600 hover:text-oxford-950'}`}>Traducció</button>
          </div>

          <button onClick={handleResetAll} className="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-rose-50 hover:text-crimson-700 hover:border-crimson-200 text-slate-600 text-xs font-semibold transition-all">
            🔄 Reiniciar
          </button>
        </div>
      </div>

      <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200">
        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
          {['ALL', 'AAA', 'ABA', 'ABB', 'ABC'].map(t => (
            <button key={t} onClick={() => setSelectedType(t)} className={`px-3 py-1 rounded-md text-xs font-mono font-bold transition-all ${selectedType === t ? 'bg-crimson-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
              {t === 'ALL' ? 'TOTS (162)' : t}
            </button>
          ))}
        </div>

        <div className="relative">
          <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Cercar verb..." className="w-full sm:w-48 pl-3 pr-8 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:ring-1 focus:ring-oxford-700" />
          {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1.5 text-xs text-slate-400">&times;</button>}
        </div>
      </div>

      <div className="space-y-2">
        {filteredVerbs.map(verb => {
          const userAns = answers[verb.id] || {};
          const isRev = !!revealed[verb.id];
          const isPastCorrect = checkVerbMatch(userAns.past, verb.past, verb.altPast);
          const isPartCorrect = checkVerbMatch(userAns.part, verb.part, verb.altPart);
          const isTransCorrect = checkMeaningMatch(userAns.trans, verb.cat);

          return (
            <div key={verb.id} className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-xs hover:border-slate-300 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-[170px]">
                <span className="w-6 font-mono text-[11px] text-slate-400 font-bold">#{verb.id}</span>
                <div>
                  <span className="font-serif-academic font-bold text-base text-oxford-950">{verb.inf}</span>
                  <span className="text-[10px] font-mono ml-2 px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-bold">{verb.type}</span>
                  <p className="text-xs text-slate-500 font-sans truncate max-w-[200px]">{verb.cat}</p>
                </div>
              </div>

              {mode === 'pastPart' ? (
                <div className="flex items-center gap-2 flex-1 max-w-md">
                  <div className="relative flex-1">
                    <input
                      ref={el => inputsRef.current[`${verb.id}_past`] = el}
                      type="text"
                      placeholder="Past Simple"
                      value={userAns.past || ''}
                      onChange={e => handleInputChange(verb.id, 'past', e.target.value)}
                      className={`w-full px-3 py-1.5 text-xs font-mono rounded-lg border transition-all ${isPastCorrect ? 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold' : 'border-slate-200'}`}
                    />
                    {isRev && !isPastCorrect && (
                      <span className="absolute right-2 top-2 text-[10px] font-mono text-amber-700 font-bold">{verb.past}</span>
                    )}
                  </div>

                  <div className="relative flex-1">
                    <input
                      ref={el => inputsRef.current[`${verb.id}_part`] = el}
                      type="text"
                      placeholder="Past Participle"
                      value={userAns.part || ''}
                      onChange={e => handleInputChange(verb.id, 'part', e.target.value)}
                      className={`w-full px-3 py-1.5 text-xs font-mono rounded-lg border transition-all ${isPartCorrect ? 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold' : 'border-slate-200'}`}
                    />
                    {isRev && !isPartCorrect && (
                      <span className="absolute right-2 top-2 text-[10px] font-mono text-amber-700 font-bold">{verb.part}</span>
                    )}
                  </div>
                </div>
              ) : (
                <div className="flex items-center gap-2 flex-1 max-w-md">
                  <div className="relative flex-1">
                    <input
                      ref={el => inputsRef.current[`${verb.id}_trans`] = el}
                      type="text"
                      placeholder="Traducció en Català"
                      value={userAns.trans || ''}
                      onChange={e => handleInputChange(verb.id, 'trans', e.target.value)}
                      className={`w-full px-3 py-1.5 text-xs rounded-lg border transition-all ${isTransCorrect ? 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold' : 'border-slate-200'}`}
                    />
                    {isRev && !isTransCorrect && (
                      <span className="absolute right-2 top-2 text-[10px] text-amber-700 font-semibold">{verb.cat}</span>
                    )}
                  </div>
                </div>
              )}

              <div className="flex items-center gap-1.5 self-end sm:self-auto">
                <button onClick={() => toggleReveal(verb.id)} className="p-1.5 text-slate-400 hover:text-oxford-900 text-xs" title="Mostrar solució">
                  {isRev ? '🙈' : '👁️'}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// --- 3. VOCAB TRAINER (3D FLASHCARDS, SUPABASE MISTAKES LOGGING, LOCALSTORAGE) ---
function VocabTrainer({ session, onCompleteAction }) {
  const [selectedDay, setSelectedDay] = useState('Dilluns');
  const [direction, setDirection] = useState('cat_to_eng');
  const [isFlipped, setIsFlipped] = useState(false);

  const getDayItems = (day) => VOCAB_DATA.filter(item => item.day === day);

  const [queue, setQueue] = useState(() => {
    try {
      const saved = localStorage.getItem(`esh_vocab_queue_${selectedDay}`);
      return saved ? JSON.parse(saved) : getDayItems(selectedDay);
    } catch(e) { return getDayItems(selectedDay); }
  });

  const [mastered, setMastered] = useState(() => {
    try {
      const saved = localStorage.getItem(`esh_vocab_mastered_${selectedDay}`);
      return saved ? JSON.parse(saved) : [];
    } catch(e) { return []; }
  });

  const [historyStack, setHistoryStack] = useState(() => {
    try {
      const saved = localStorage.getItem(`esh_vocab_history_${selectedDay}`);
      return saved ? JSON.parse(saved) : [];
    } catch(e) { return []; }
  });

  useEffect(() => {
    try {
      const savedQ = localStorage.getItem(`esh_vocab_queue_${selectedDay}`);
      const savedM = localStorage.getItem(`esh_vocab_mastered_${selectedDay}`);
      const savedH = localStorage.getItem(`esh_vocab_history_${selectedDay}`);
      setQueue(savedQ ? JSON.parse(savedQ) : getDayItems(selectedDay));
      setMastered(savedM ? JSON.parse(savedM) : []);
      setHistoryStack(savedH ? JSON.parse(savedH) : []);
      setIsFlipped(false);
    } catch(e) {
      setQueue(getDayItems(selectedDay));
      setMastered([]);
      setHistoryStack([]);
    }
  }, [selectedDay]);

  useEffect(() => {
    try {
      localStorage.setItem(`esh_vocab_queue_${selectedDay}`, JSON.stringify(queue));
      localStorage.setItem(`esh_vocab_mastered_${selectedDay}`, JSON.stringify(mastered));
      localStorage.setItem(`esh_vocab_history_${selectedDay}`, JSON.stringify(historyStack));
    } catch(e) {}
  }, [queue, mastered, historyStack, selectedDay]);

  const currentCard = queue[0];
  const totalDayItems = getDayItems(selectedDay).length;

  const handleFlip = () => setIsFlipped(f => !f);

  const handleNext = (wasHard) => {
    if (!currentCard) return;

    if (wasHard && supabaseClient && session?.user?.id) {
      supabaseClient
        .from('user_mistakes')
        .select('id, mistake_count')
        .eq('user_id', session.user.id)
        .eq('word_id', currentCard.id)
        .maybeSingle()
        .then(({ data, error }) => {
          if (!error && data) {
            supabaseClient
              .from('user_mistakes')
              .update({ mistake_count: data.mistake_count + 1, last_reviewed_at: new Date().toISOString() })
              .eq('id', data.id)
              .then(() => {});
          } else if (!data) {
            supabaseClient
              .from('user_mistakes')
              .insert({ user_id: session.user.id, word_id: currentCard.id, mistake_count: 1, last_reviewed_at: new Date().toISOString() })
              .then(() => {});
          }
        });
    }

    setHistoryStack(prev => [...prev, { card: currentCard, queue: [...queue], mastered: [...mastered] }]);
    setIsFlipped(false);

    if (wasHard) {
      const rest = queue.slice(1);
      const insertIdx = Math.min(3, rest.length);
      const newQueue = [...rest.slice(0, insertIdx), currentCard, ...rest.slice(insertIdx)];
      setQueue(newQueue);
    } else {
      setMastered(m => [...m, currentCard]);
      setQueue(q => q.slice(1));
      if (onCompleteAction) onCompleteAction();
    }
  };

  const handleUndo = () => {
    if (historyStack.length === 0) return;
    const last = historyStack[historyStack.length - 1];
    setQueue(last.queue);
    setMastered(last.mastered);
    setHistoryStack(h => h.slice(0, -1));
    setIsFlipped(false);
  };

  const handleResetSession = () => {
    if (confirm(`Vols reiniciar la sessió de ${selectedDay}? Es restabliran totes les targetes d'aquest dia.`)) {
      const original = getDayItems(selectedDay);
      setQueue(original);
      setMastered([]);
      setHistoryStack([]);
      setIsFlipped(false);
      try {
        localStorage.removeItem(`esh_vocab_queue_${selectedDay}`);
        localStorage.removeItem(`esh_vocab_mastered_${selectedDay}`);
        localStorage.removeItem(`esh_vocab_history_${selectedDay}`);
      } catch(e) {}
    }
  };

  return (
    <div className="space-y-6 max-w-2xl mx-auto">
      <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
        <div className="flex bg-slate-100 p-1 rounded-lg text-xs font-semibold">
          {['Dilluns', 'Dimarts', 'Divendres'].map(day => (
            <button key={day} onClick={() => setSelectedDay(day)} className={`px-4 py-1.5 rounded transition-all ${selectedDay === day ? 'bg-crimson-700 text-white font-bold shadow-xs' : 'text-slate-600 hover:text-oxford-950'}`}>
              {day}
            </button>
          ))}
        </div>

        <div className="flex items-center gap-2">
          <button onClick={() => setDirection(d => d === 'cat_to_eng' ? 'eng_to_cat' : 'cat_to_eng')} className="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700">
            {direction === 'cat_to_eng' ? 'Català → Anglès' : 'Anglès → Català'} 🔄
          </button>
          <button onClick={handleResetSession} className="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-rose-50 text-slate-600 hover:text-crimson-700 hover:border-crimson-200">
            🔄 Reiniciar Sessió
          </button>
        </div>
      </div>

      <div className="flex items-center justify-between text-xs font-mono text-slate-500 px-1">
        <span>Dominades: <strong>{mastered.length}</strong> / {totalDayItems}</span>
        <span>Pendents a la cua: <strong>{queue.length}</strong></span>
      </div>

      {currentCard ? (
        <div className="perspective-container h-72 sm:h-80 w-full cursor-pointer select-none" onClick={handleFlip}>
          <div className={`card-3d-inner shadow-lg ${isFlipped ? 'flipped' : ''}`}>
            {/* FRONT */}
            <div className="card-face bg-gradient-to-br from-[#002147] to-[#041226] text-white p-8 flex flex-col justify-between border-2 border-amber-400/40">
              <div className="flex justify-between items-center text-xs font-mono text-amber-300">
                <span className="uppercase tracking-widest">{selectedDay} &bull; Expressió #{currentCard.id}</span>
                <span className="text-[11px] bg-white/10 px-2 py-0.5 rounded border border-white/20">Clica per girar</span>
              </div>
              <div className="text-center my-auto px-4">
                <h3 className="text-xl sm:text-2xl font-serif-academic font-bold leading-relaxed text-white">
                  {direction === 'cat_to_eng' ? currentCard.cat : currentCard.eng}
                </h3>
              </div>
              <div className="text-center text-[11px] font-mono text-slate-400">
                [Espai] o Fes Clic per veure la resposta
              </div>
            </div>

            {/* BACK */}
            <div className="card-face card-face-back bg-white text-oxford-950 p-8 flex flex-col justify-between border-2 border-crimson-600 shadow-xl">
              <div className="flex justify-between items-center text-xs font-mono text-slate-400">
                <span className="text-crimson-700 font-bold uppercase tracking-widest">Solució Acadèmica</span>
                <span className="text-[11px] bg-slate-100 px-2 py-0.5 rounded text-slate-600">Revisió Activa</span>
              </div>
              <div className="text-center my-auto px-4">
                <p className="text-xs uppercase font-mono text-slate-400 mb-2">Traducció directa:</p>
                <h3 className="text-xl sm:text-2xl font-serif-academic font-bold text-oxford-950 leading-relaxed">
                  {direction === 'cat_to_eng' ? currentCard.eng : currentCard.cat}
                </h3>
              </div>
              <div className="flex items-center justify-center gap-3 pt-4 border-t border-slate-100" onClick={e => e.stopPropagation()}>
                <button onClick={() => handleNext(true)} className="flex-1 py-2.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 font-semibold text-xs transition-colors">
                  Difícil / Errada ⚠️
                </button>
                <button onClick={() => handleNext(false)} className="flex-1 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow-sm transition-colors">
                  Ho recordo bé ✅
                </button>
              </div>
            </div>
          </div>
        </div>
      ) : (
        <div className="rounded-2xl bg-white border border-slate-200 p-12 text-center shadow-sm space-y-4">
          <div className="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-3xl mx-auto">
            🎓
          </div>
          <h3 className="text-xl font-serif-academic font-bold text-oxford-950">Mòdul de {selectedDay} Completat!</h3>
          <p className="text-xs text-slate-600 max-w-sm mx-auto">
            Has dominat totes les {totalDayItems} expressions programades per a aquesta unitat. Continua amb el següent dia o reinicia per repassar.
          </p>
          <button onClick={handleResetSession} className="px-5 py-2 rounded-lg bg-oxford-900 text-white text-xs font-semibold hover:bg-oxford-800 transition-all">
            Tornar a Practicar aquest Dia
          </button>
        </div>
      )}

      {historyStack.length > 0 && currentCard && (
        <div className="text-center">
          <button onClick={handleUndo} className="text-xs text-slate-500 hover:text-oxford-900 font-semibold">
            &larr; Desfer última acció
          </button>
        </div>
      )}
    </div>
  );
}

// --- 4. WEAKNESSES TRAINER (WITH ACTIVE STUDY MODE) ---
function WeaknessesTrainer({ session, onNavigate }) {
  const [mistakes, setMistakes] = useState([]);
  const [loading, setLoading] = useState(true);

  // ACTIVE STUDY MODE STATES
  const [studyMode, setStudyMode] = useState(false);
  const [studyQueue, setStudyQueue] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);

  const fetchMistakes = async () => {
    if (!supabaseClient || !session?.user?.id) {
      setLoading(false);
      return;
    }
    setLoading(true);
    try {
      const { data, error } = await supabaseClient
        .from('user_mistakes')
        .select('*')
        .eq('user_id', session.user.id)
        .gt('mistake_count', 0)
        .order('mistake_count', { ascending: false });

      if (error) throw error;

      const mapped = (data || []).map(row => {
        const idStr = String(row.word_id);
        const vocab = VOCAB_DATA.find(v => String(v.id) === idStr);
        if (vocab) {
          return {
            ...row,
            cat: vocab.cat,
            eng: vocab.eng,
            title: vocab.eng,
            subtitle: vocab.cat,
            tag: `Vocabulari (${vocab.day})`
          };
        }
        const verb = VERBS_DATA.find(vb => String(vb.id) === idStr || vb.inf === idStr);
        if (verb) {
          return {
            ...row,
            cat: verb.cat,
            eng: `${verb.inf} (past: ${verb.past}, part: ${verb.part})`,
            title: `${verb.inf} - ${verb.past} - ${verb.part}`,
            subtitle: verb.cat,
            tag: `Verb (Grup ${verb.type})`
          };
        }
        return {
          ...row,
          cat: `Ítem #${idStr}`,
          eng: `Ítem #${idStr}`,
          title: `Ítem #${idStr}`,
          subtitle: 'Punt feble registrat',
          tag: 'General'
        };
      });

      setMistakes(mapped);
    } catch (err) {
      console.error(err);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchMistakes();
  }, [session]);

  const handleStartStudy = () => {
    if (mistakes.length === 0) return;
    // Shuffle mistakes
    const shuffled = [...mistakes].sort(() => Math.random() - 0.5);
    setStudyQueue(shuffled);
    setCurrentIndex(0);
    setIsFlipped(false);
    setStudyMode(true);
  };

  const handlePrevStudyCard = () => {
    if (currentIndex > 0) {
      setIsFlipped(false);
      setCurrentIndex(prev => prev - 1);
    }
  };

  const handleNextStudyCard = () => {
    setIsFlipped(false);
    if (currentIndex + 1 < studyQueue.length) {
      setCurrentIndex(prev => prev + 1);
    } else {
      // Completed the session
      if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
      alert("Enhorabona! Has completat l'entrenament de tots els teus punts dèbils.");
      setStudyMode(false);
      setCurrentIndex(0);
    }
  };

  const handleMarkMastered = async () => {
    const currentCard = studyQueue[currentIndex];
    if (!currentCard) return;

    if (supabaseClient && session?.user?.id) {
      try {
        await supabaseClient
          .from('user_mistakes')
          .update({ mistake_count: 0, last_reviewed_at: new Date().toISOString() })
          .eq('user_id', session.user.id)
          .eq('word_id', currentCard.word_id);
      } catch (err) {
        console.error("Error updating mistake_count in Supabase:", err);
      }
    }

    const newQueue = studyQueue.filter((_, idx) => idx !== currentIndex);
    setMistakes(prev => prev.filter(m => String(m.word_id) !== String(currentCard.word_id)));
    setStudyQueue(newQueue);
    setIsFlipped(false);

    if (newQueue.length === 0) {
      if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
      setStudyMode(false);
      setCurrentIndex(0);
    } else if (currentIndex >= newQueue.length) {
      setCurrentIndex(Math.max(0, newQueue.length - 1));
    }
  };

  if (loading) {
    return (
      <div className="text-center py-16 text-slate-500 font-mono text-xs">
        <div className="w-8 h-8 rounded-full border-2 border-crimson-700 border-t-transparent animate-spin mx-auto mb-3"></div>
        Carregant els teus errors de Supabase...
      </div>
    );
  }

  // --- ACTIVE STUDY MODE VIEW (3D FLASHCARD) ---
  if (studyMode && studyQueue.length > 0) {
    const currentItem = studyQueue[currentIndex];

    return (
      <div className="space-y-6 max-w-2xl mx-auto view-enter">
        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <span className="text-[10px] font-mono uppercase font-bold px-2 py-0.5 rounded bg-crimson-50 text-crimson-700 border border-crimson-100">
              Sessió d'Entrenament Actiu
            </span>
            <h2 className="text-lg font-serif-academic font-bold text-oxford-950 mt-1">
              Targeta {currentIndex + 1} de {studyQueue.length}
            </h2>
          </div>
          <button
            onClick={() => setStudyMode(false)}
            className="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-600 text-xs font-semibold transition-all"
          >
            ← Tornar a la llista / Sortir
          </button>
        </div>

        {/* 3D FLASHCARD CONTAINER */}
        <div 
          className="perspective-container h-72 sm:h-80 w-full cursor-pointer select-none" 
          onClick={() => setIsFlipped(f => !f)}
        >
          <div className={`card-3d-inner shadow-lg ${isFlipped ? 'flipped' : ''}`}>
            
            {/* FRONT: item.cat */}
            <div className="card-face bg-gradient-to-br from-[#002147] to-[#041226] text-white p-8 flex flex-col justify-between border-2 border-amber-400/40">
              <div className="flex justify-between items-center text-xs font-mono text-amber-300">
                <span className="uppercase tracking-widest">{currentItem.tag}</span>
                <span className="text-[11px] bg-white/10 px-2 py-0.5 rounded border border-white/20">Clica per girar</span>
              </div>
              <div className="text-center my-auto px-4">
                <span className="text-xs uppercase font-mono text-slate-400 block mb-2">Com es diu en anglès?</span>
                <h3 className="text-xl sm:text-2xl font-serif-academic font-bold leading-relaxed text-white">
                  {currentItem.cat}
                </h3>
              </div>
              <div className="text-center text-[11px] font-mono text-slate-400">
                Fes clic a la targeta per comprovar la solució
              </div>
            </div>

            {/* BACK: item.eng (or infinitive) */}
            <div className="card-face card-face-back bg-white text-oxford-950 p-8 flex flex-col justify-between border-2 border-crimson-600 shadow-xl">
              <div className="flex justify-between items-center text-xs font-mono text-slate-400">
                <span className="text-crimson-700 font-bold uppercase tracking-widest">Solució</span>
                <span className="bg-rose-50 text-rose-700 font-bold text-[11px] px-2 py-0.5 rounded border border-rose-100">
                  {currentItem.mistake_count} errades prèvies
                </span>
              </div>
              <div className="text-center my-auto px-4">
                <p className="text-xs uppercase font-mono text-slate-400 mb-2">Anglès acadèmic:</p>
                <h3 className="text-xl sm:text-2xl font-serif-academic font-bold text-oxford-950 leading-relaxed">
                  {currentItem.eng}
                </h3>
                <p className="text-xs text-slate-500 mt-2 font-sans italic">{currentItem.cat}</p>
              </div>
              <div className="text-center text-[11px] font-mono text-slate-400">
                Fes servir els botons inferiors per navegar o marcar com apresa
              </div>
            </div>

          </div>
        </div>

        {/* 3-BUTTON CONTROLS ROW */}
        <div className="flex items-center gap-3 pt-2">
          <button
            onClick={handlePrevStudyCard}
            disabled={currentIndex === 0}
            className={`flex-1 py-2.5 rounded-lg border font-semibold text-xs transition-colors flex items-center justify-center gap-1.5 ${
              currentIndex === 0
                ? 'border-slate-200 text-slate-300 bg-slate-50 cursor-not-allowed'
                : 'border-slate-300 bg-white hover:bg-slate-100 text-oxford-900 shadow-xs'
            }`}
          >
            <span>←</span>
            <span>Anterior</span>
          </button>
          
          <button
            onClick={handleMarkMastered}
            className="flex-1 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md transition-colors flex items-center justify-center gap-1.5"
            title="Marca la paraula com apresa i elimina-la dels teus errors"
          >
            <span>✅</span>
            <span>Ja me la sé</span>
          </button>

          <button
            onClick={handleNextStudyCard}
            className="flex-1 py-2.5 rounded-lg bg-crimson-700 hover:bg-crimson-800 text-white font-bold text-xs shadow-md transition-colors flex items-center justify-center gap-1.5"
          >
            <span>Següent</span>
            <span>→</span>
          </button>
        </div>
      </div>
    );
  }

  // --- EMPTY STATE IF 0 MISTAKES ---
  if (mistakes.length === 0) {
    return (
      <div className="rounded-2xl bg-white border border-slate-200 p-12 text-center shadow-sm max-w-lg mx-auto space-y-4">
        <div className="w-20 h-20 rounded-full bg-amber-50 border-2 border-amber-300 text-amber-500 flex items-center justify-center text-4xl mx-auto shadow-inner">
          🏆
        </div>
        <h2 className="text-2xl font-serif-academic font-bold text-oxford-950">
          Excel·lent! No tens cap error registrat actualment.
        </h2>
        <p className="text-xs text-slate-600 leading-relaxed">
          El teu expedient està completament net. Quan fallis targetes als mòduls de vocabulari o verbs, apareixeran aquí perquè puguis entrenar-les de manera personalitzada.
        </p>
        <button
          onClick={() => onNavigate && onNavigate('vocab')}
          className="mt-2 px-4 py-2 rounded-lg bg-oxford-900 hover:bg-oxford-800 text-white text-xs font-semibold shadow-xs"
        >
          Practicar Vocabulari &rarr;
        </button>
      </div>
    );
  }

  // --- MAIN WEAKNESSES LIST VIEW ---
  return (
    <div className="space-y-4 max-w-4xl mx-auto">
      {/* HEADER WITH PROMINENT "ENTRENAR PUNTS DÈBILS" BUTTON */}
      <div className="bg-white p-5 rounded-xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm">
        <div>
          <h2 className="text-lg font-serif-academic font-bold text-oxford-950">
            Els Meus Errors Registrats ({mistakes.length})
          </h2>
          <p className="text-xs text-slate-500 font-sans mt-0.5">
            Elements registrats a la base de dades ordenats per major nombre d'errades.
          </p>
        </div>

        <div className="flex items-center gap-3">
          <button 
            onClick={fetchMistakes} 
            className="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 transition-colors"
          >
            🔄 Actualitzar
          </button>
          <button
            onClick={handleStartStudy}
            className="px-5 py-2.5 rounded-lg bg-crimson-700 hover:bg-crimson-800 text-white font-bold text-xs tracking-wide shadow-md transition-all flex items-center gap-2 hover:scale-[1.02]"
          >
            <span>🏋️ Entrenar Punts Dèbils</span>
          </button>
        </div>
      </div>

      <div className="space-y-3">
        {mistakes.map((m, idx) => (
          <div key={idx} className="bg-white border border-slate-200 p-4 rounded-xl flex items-center justify-between shadow-xs hover:border-slate-300 transition-colors">
            <div>
              <span className="text-[10px] font-mono uppercase font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                {m.tag}
              </span>
              <h3 className="text-base font-serif-academic font-bold text-oxford-950 mt-1">
                {m.title}
              </h3>
              <p className="text-xs text-slate-500 font-sans">{m.subtitle}</p>
            </div>
            <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-crimson-50 border border-crimson-200 text-crimson-800 font-mono text-xs font-bold whitespace-nowrap">
              {m.mistake_count} {m.mistake_count === 1 ? 'error' : 'errors'}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// --- AUTH WRAPPER (AuthApp & AuthView) ---
function AuthApp() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!supabaseClient) { setLoading(false); return; }
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      setLoading(false);
    });
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      setSession(session);
    });
    return () => subscription.unsubscribe();
  }, []);

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center font-mono text-xs text-oxford-900 bg-[#f8fafc]">
        Iniciant JP ENGLISH HUB...
      </div>
    );
  }

  if (!session) {
    return <AuthView onAuthSuccess={(s) => setSession(s)} />;
  }

  return <App session={session} userEmail={session?.user?.email} onLogout={() => supabaseClient.auth.signOut()} />;
}

function AuthView({ onAuthSuccess }) {
  const [authMode, setAuthMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [errorMsg, setErrorMsg] = useState('');

  const handleAuth = async (e) => {
    e.preventDefault();
    if (!supabaseClient) return;
    setErrorMsg('');
    if (authMode === 'login') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) setErrorMsg(error.message);
      else if (data?.session) onAuthSuccess(data.session);
    } else {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) setErrorMsg(error.message);
      else if (data?.session) onAuthSuccess(data.session);
    }
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center bg-[#f8fafc] p-4 font-sans">
      <div className="mb-6 text-center">
        <div className="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-oxford-900 to-crimson-700 shadow-md mx-auto mb-3 overflow-hidden flex items-center justify-center bg-white border-2 border-amber-400">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuANdXRXZBg9cU1j_sfQ2wF0gfNyU-WjnrBPhwFOdnBtWPJBAgmO-GHhe0RVI59drNLxSn5I_ExV80sfuqPeWqh7JCvAqSwdlaQ7HdsDMYpS111Dce5dA21_LpwJtyKyqCpJJ3oAQJfJDwP99ZkShKr9_sTB-SG3a98quS72SacRrUQT_wSQc4LZfrGx_aYO2vYhHcJPjFM8UQh1IYtiUZxQXrojerqzLEghEdm00pSiS9aBGxFsr-C9eg" alt="JP Emblem" className="w-full h-full object-cover rounded-full" />
        </div>
        <h1 className="text-2xl font-serif-academic font-bold text-oxford-950">JP ENGLISH HUB</h1>
        <p className="text-xs uppercase font-mono tracking-widest text-crimson-700 font-bold mt-0.5">Plataforma Acadèmica Batxillerat &amp; PAU</p>
      </div>

      <div className="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="flex border-b border-slate-200 bg-slate-50/50">
          <button onClick={() => setAuthMode('login')} className={`flex-1 py-3 text-xs font-semibold tracking-wide transition-all ${authMode === 'login' ? 'bg-white text-oxford-950 border-b-2 border-crimson-700 font-bold' : 'text-slate-500 hover:text-slate-800'}`}>
            Iniciar Sessió
          </button>
          <button onClick={() => setAuthMode('register')} className={`flex-1 py-3 text-xs font-semibold tracking-wide transition-all ${authMode === 'register' ? 'bg-white text-oxford-950 border-b-2 border-crimson-700 font-bold' : 'text-slate-500 hover:text-slate-800'}`}>
            Crear Compte
          </button>
        </div>

        <div className="p-6 sm:p-8">
          {errorMsg && (
            <div className="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">
              {errorMsg}
            </div>
          )}

          <form onSubmit={handleAuth} className="space-y-4">
            <div>
              <label className="block text-[11px] font-mono font-bold tracking-wider text-slate-600 uppercase mb-1.5">Correu Electrònic</label>
              <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="alumne@institut.cat" className="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 focus:outline-none focus:ring-1 focus:ring-oxford-700 focus:border-oxford-700" />
            </div>

            <div>
              <label className="block text-[11px] font-mono font-bold tracking-wider text-slate-600 uppercase mb-1.5">Contrasenya</label>
              <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" className="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 focus:outline-none focus:ring-1 focus:ring-oxford-700 focus:border-oxford-700" />
            </div>

            <button type="submit" className="w-full py-2.5 rounded-lg bg-oxford-900 hover:bg-oxford-800 text-white font-bold text-xs tracking-wide transition-all shadow-sm">
              {authMode === 'login' ? 'Entrar a la Plataforma →' : 'Registrar-me →'}
            </button>
          </form>
        </div>

        <div className="px-6 py-3 bg-slate-50 border-t border-slate-100 text-center text-[11px] text-slate-500 font-sans">
          Seguretat d'accés gestionada oficialment amb Supabase.
        </div>
      </div>

      <div className="mt-8 text-center text-[11px] text-slate-400 font-sans">
        JP ENGLISH HUB &bull; Desenvolupat per <strong className="text-crimson-700 font-bold">JanPick</strong>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AuthApp />);
</script>
</body></html>
