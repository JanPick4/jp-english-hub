// Helper: Normalize answer string
function cleanStr(s) {
  return (s || '')
    .toLowerCase()
    .trim()
    .replace(/[.,/#!$%^&*;:{}=\-_`~()?"']/g, "")
    .replace(/\s+/g, ' ');
}

function checkVerbMatch(userVal, correctVal, altVal) {
  if (!userVal) return false;
  const cleanUser = userVal.toLowerCase().trim();
  const cleanCorrect = (correctVal || "").toLowerCase().trim();
  const cleanAlt = (altVal || "").toLowerCase().trim();
  return cleanUser === cleanCorrect || (cleanAlt && cleanUser === cleanAlt);
}

// STRICT CATALAN MEANING VALIDATION
function checkMeaningMatch(userVal, meaningStr) {
  if (!userVal || !meaningStr) return false;
  const u = cleanStr(userVal);
  if (!u || u.length < 2) return false;
  const parts = meaningStr.split(/[,/]/).map(cleanStr);
  return parts.some(p => p === u);
}

    e.preventDefault();
    if (!supabaseClient) {
      setErrorMsg('No s\'ha pogut connectar amb el servidor de Supabase.');
      return;
    }
    setErrorMsg('');
    setSuccessMsg('');
    setSubmitting(true);

    try {
      if (authMode === 'login') {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email.trim(),
          password: password,
        });
        if (error) {
          setErrorMsg(
            error.message.includes('Invalid login') 
              ? 'Credencials incorrectes. Comprova el correu i la contrasenya.' 
              : error.message
          );
        } else if (data?.session) {
          setSuccessMsg('Accés autoritzat. Benvingut de nou a l\'acadèmia, alumne.');
          if (onAuthSuccess) onAuthSuccess(data.session);
        }

// --- AUTHAPP COMPONENT (AUTHENTICATION WRAPPER) ---
function AuthApp() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!supabaseClient) {
      setLoading(false);
      return;
    }

    // 1. Initial Session Check
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      setLoading(false);
    });

    // 2. Realtime Auth State Listener
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      setSession(session);
      setLoading(false);
    });

    return () => subscription.unsubscribe();
  }, []);

  if (loading) {
    return (
      <div className="min-h-screen bg-[#002147] flex flex-col items-center justify-center text-white">
        <div className="w-10 h-10 rounded-full border-4 border-amber-400 border-t-transparent animate-spin mb-3"></div>
        <p className="font-serif-academic text-sm tracking-wide text-amber-200">Verificant credencials d'accés a l'acadèmia...</p>
      </div>
    );
  }

  // If NOT authenticated, render AuthView
  if (!session) {
    return <AuthView onAuthSuccess={(sess) => setSession(sess)} />;
  }

  // If authenticated, render App passing userEmail, onLogout, and session
  return (
    <App 
      session={session}
      userEmail={session.user.email} 
      onLogout={() => supabaseClient.auth.signOut()} 
    />
  );
}

function VerbsTrainer({ onCompleteAction }) {
  const [selectedGroup, setSelectedGroup] = useState('ALL'); // 'ALL' | 'AAA' | 'ABA' | 'ABB' | 'ABC'
  const [mode, setMode] = useState('forms'); // 'forms' | 'trans'
  const [verbDirection, setVerbDirection] = useState('eng_to_cat'); // 'eng_to_cat' | 'cat_to_eng'
  const [currentIndex, setCurrentIndex] = useState(0);

  // Form states
  const [infinitiveInput, setInfinitiveInput] = useState('');
  const [pastInput, setPastInput] = useState('');
  const [participleInput, setParticipleInput] = useState('');
  const [transInput, setTransInput] = useState('');

  // Stats
  const [completedCount, setCompletedCount] = useState(0);
  const [revealed, setRevealed] = useState(false);

  // Input Refs for instant focus jumps
  const infRef = useRef(null);
  const pastRef = useRef(null);
  const partRef = useRef(null);
  const transRef = useRef(null);

  // Filtered List
  const filteredVerbs = useMemo(() => {
    if (selectedGroup === 'ALL') return VERBS_DATA;
    return VERBS_DATA.filter(v => v.type === selectedGroup);
  }, [selectedGroup]);

  const currentVerb = filteredVerbs[currentIndex] || filteredVerbs[0];

  // Reset inputs when verb or filter changes
  useEffect(() => {
    resetInputs();
  }, [currentIndex, selectedGroup, mode, verbDirection]);

  const resetInputs = () => {
    setInfinitiveInput('');
    setPastInput('');
    setParticipleInput('');
    setTransInput('');
    setRevealed(false);
  };

  // Next Verb Handler
  const handleNext = () => {
    if (currentIndex < filteredVerbs.length - 1) {
      setCurrentIndex(prev => prev + 1);
    } else {
      setCurrentIndex(0);
      if (window.confetti) {
        window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }
  };

  // Previous Verb Handler
  const handlePrev = () => {
    if (currentIndex > 0) {
      setCurrentIndex(prev => prev - 1);
    } else {
      setCurrentIndex(filteredVerbs.length - 1);
    }
  };

  // HYPER-FLOW: Live validation checks
  const isPastCorrect = useMemo(() => {
    if (!pastInput) return false;
    return checkVerbMatch(pastInput, currentVerb.past, currentVerb.altPast);
  }, [pastInput, currentVerb]);

  const isPartCorrect = useMemo(() => {
    if (!participleInput) return false;
    return checkVerbMatch(participleInput, currentVerb.part, currentVerb.altPart);
  }, [participleInput, currentVerb]);

  const isInfCorrect = useMemo(() => {
    if (!infinitiveInput) return false;
    return checkVerbMatch(infinitiveInput, currentVerb.inf);
  }, [infinitiveInput, currentVerb]);

  const isTransCorrect = useMemo(() => {
    if (!transInput) return false;
    if (verbDirection === 'eng_to_cat') {
      return checkMeaningMatch(transInput, currentVerb.cat);
    } else {
      return checkVerbMatch(transInput, currentVerb.inf);
    }
  }, [transInput, currentVerb, verbDirection]);

  // Handle Past typing & Auto-focus jump
  const handlePastChange = (e) => {
    const val = e.target.value;
    setPastInput(val);
    if (checkVerbMatch(val, currentVerb.past, currentVerb.altPast)) {
      partRef.current?.focus();
    }
  };

  // Handle Participle typing & Auto advance
  const handlePartChange = (e) => {
    const val = e.target.value;
    setParticipleInput(val);
    if (checkVerbMatch(val, currentVerb.part, currentVerb.altPart) && isPastCorrect) {
      setTimeout(() => {
        setCompletedCount(c => c + 1);
        if (onCompleteAction) onCompleteAction();
        handleNext();
      }, 250);
    }
  };

  // Handle Translation typing & Auto advance
  const handleTransChange = (e) => {
    const val = e.target.value;
    setTransInput(val);
    let correct = false;
    if (verbDirection === 'eng_to_cat') {
      correct = checkMeaningMatch(val, currentVerb.cat);
    } else {
      correct = checkVerbMatch(val, currentVerb.inf);
    }

    if (correct) {
      setTimeout(() => {
        setCompletedCount(c => c + 1);
        if (onCompleteAction) onCompleteAction();
        handleNext();
      }, 280);
    }
  };

  return (
    <div className="space-y-6 max-w-4xl mx-auto">
      {/* Top Filter & Mode Selection Bar */}
      <div className="bg-white rounded-xl border border-slate-200/90 p-4 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
        
        {/* Morphology Group Pills */}
        <div className="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 text-xs font-semibold">
          <span className="text-slate-400 font-mono text-[11px] mr-1 hidden sm:inline">Grup:</span>
          {['ALL', 'AAA', 'ABA', 'ABB', 'ABC'].map(grp => (
            <button
              key={grp}
              onClick={() => { setSelectedGroup(grp); setCurrentIndex(0); }}
              className={`px-3 py-1.5 rounded-lg transition-all ${
                selectedGroup === grp
                  ? 'bg-oxford-900 text-white shadow-xs font-bold'
                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
              }`}
            >
              {grp === 'ALL' ? 'Tots (162)' : grp}
            </button>
          ))}
        </div>

        {/* Mode Selector (Forms vs Translation) */}
        <div className="flex items-center gap-2 self-end md:self-auto">
          <div className="bg-slate-100 p-1 rounded-lg border border-slate-200 flex items-center text-xs font-semibold">
            <button
              onClick={() => setMode('forms')}
              className={`px-3 py-1 rounded-md transition-all ${
                mode === 'forms' 
                  ? 'bg-white text-oxford-900 shadow-xs font-bold' 
                  : 'text-slate-600 hover:text-slate-900'
              }`}
            >
              Formes Verbals
            </button>
            <button
              onClick={() => setMode('trans')}
              className={`px-3 py-1 rounded-md transition-all ${
                mode === 'trans' 
                  ? 'bg-white text-oxford-900 shadow-xs font-bold' 
                  : 'text-slate-600 hover:text-slate-900'
              }`}
            >
              Traducció
            </button>
          </div>

          {/* Bidirectional Translation Switcher (When in Translation Mode) */}
          {mode === 'trans' && (
            <button
              onClick={() => setVerbDirection(d => d === 'eng_to_cat' ? 'cat_to_eng' : 'eng_to_cat')}
              className="px-2.5 py-1.5 rounded-lg bg-oxford-50 border border-oxford-200 text-oxford-900 text-xs font-bold flex items-center gap-1 hover:bg-oxford-100 transition-colors shadow-xs"
              title="Canviar direcció de traducció"
            >
              <span>{verbDirection === 'eng_to_cat' ? '🇬🇧 → 🇦🇩' : '🇦🇩 → 🇬🇧'}</span>
              <span className="text-[10px] hidden sm:inline">Invertir</span>
            </button>
          )}
        </div>
      </div>

      {/* Main Training Interactive Board */}
      <div className="bg-white rounded-2xl border border-slate-200/90 shadow-md p-6 sm:p-10 relative overflow-hidden">
        
        {/* Header Progress Counter */}
        <div className="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
          <div className="flex items-center gap-2">
            <span className="font-mono text-xs font-bold px-2 py-0.5 rounded bg-oxford-50 text-oxford-900 border border-oxford-100">
              Grup {currentVerb.type}
            </span>
            <span className="text-slate-400 text-xs">&bull;</span>
            <span className="text-xs font-mono text-slate-500">
              Verb {currentIndex + 1} de {filteredVerbs.length}
            </span>
          </div>

          <div className="flex items-center gap-2 text-xs font-mono">
            <span className="text-slate-400">Completats:</span>
            <span className="font-bold text-crimson-700 bg-crimson-50 px-2 py-0.5 rounded border border-crimson-100">
              {completedCount}
            </span>
          </div>
        </div>

        {/* Central Display Prompt */}
        <div className="text-center my-6">
          {mode === 'forms' ? (
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-slate-400 block mb-1">
                Infinitiu Donat
              </span>
              <h2 className="text-3xl sm:text-5xl font-serif-academic font-bold text-oxford-950 tracking-wide">
                {currentVerb.inf}
              </h2>
              <p className="text-sm font-sans text-slate-500 mt-2">
                Significat en català: <span className="font-semibold text-oxford-800">{currentVerb.cat}</span>
              </p>
            </div>
          ) : (
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-slate-400 block mb-1">
                {verbDirection === 'eng_to_cat' ? 'Escriu la traducció al català' : 'Escriu l\'infinitiu en anglès'}
              </span>
              <h2 className="text-3xl sm:text-4xl font-serif-academic font-bold text-oxford-950">
                {verbDirection === 'eng_to_cat' ? currentVerb.inf : currentVerb.cat}
              </h2>

              {/* CRITICAL FIX: Only show past/part in eng_to_cat. NEVER in cat_to_eng to avoid leaking answers */}
              {verbDirection === 'eng_to_cat' && (
                <div className="flex items-center justify-center gap-2 text-xs font-mono text-slate-400 mt-2">
                  <span>Passat: <strong className="text-slate-600">{currentVerb.past}</strong></span>
                  <span>&bull;</span>
                  <span>Participi: <strong className="text-slate-600">{currentVerb.part}</strong></span>
                </div>
              )}
            </div>
          )}
        </div>

        {/* Dynamic Inputs Area */}
        <div className="max-w-xl mx-auto my-8">
          {mode === 'forms' ? (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              
              {/* Past Simple Input */}
              <div className="relative">
                <label className="block text-xs font-mono font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                  Past Simple
                </label>
                <div className="relative">
                  <input
                    ref={pastRef}
                    type="text"
                    autoFocus
                    autoComplete="off"
                    autoCorrect="off"
                    spellCheck="false"
                    value={pastInput}
                    onChange={handlePastChange}
                    placeholder="p. ex. became"
                    className={`w-full text-base font-mono font-semibold px-4 py-3 rounded-xl border-2 transition-all outline-none ${
                      isPastCorrect
                        ? 'border-emerald-500 bg-emerald-50/40 text-emerald-900'
                        : pastInput.length > 0
                        ? 'border-amber-400 bg-white text-slate-900'
                        : 'border-slate-200 focus:border-oxford-700 bg-slate-50 focus:bg-white text-slate-900'
                    }`}
                  />
                  {isPastCorrect && (
                    <span className="absolute right-3 top-3 text-emerald-600 font-bold text-base">✓</span>
                  )}
                </div>
                {revealed && (
                  <span className="text-[11px] font-mono text-crimson-700 mt-1 block">
                    Solució: <strong>{currentVerb.past}</strong> {currentVerb.altPast && `(${currentVerb.altPast})`}
                  </span>
                )}
              </div>

              {/* Past Participle Input */}
              <div className="relative">
                <label className="block text-xs font-mono font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                  Past Participle
                </label>
                <div className="relative">
                  <input
                    ref={partRef}
                    type="text"
                    autoComplete="off"
                    autoCorrect="off"
                    spellCheck="false"
                    value={participleInput}
                    onChange={handlePartChange}
                    placeholder="p. ex. become"
                    className={`w-full text-base font-mono font-semibold px-4 py-3 rounded-xl border-2 transition-all outline-none ${
                      isPartCorrect
                        ? 'border-emerald-500 bg-emerald-50/40 text-emerald-900'
                        : participleInput.length > 0
                        ? 'border-amber-400 bg-white text-slate-900'
                        : 'border-slate-200 focus:border-oxford-700 bg-slate-50 focus:bg-white text-slate-900'
                    }`}
                  />
                  {isPartCorrect && (
                    <span className="absolute right-3 top-3 text-emerald-600 font-bold text-base">✓</span>
                  )}
                </div>
                {revealed && (
                  <span className="text-[11px] font-mono text-crimson-700 mt-1 block">
                    Solució: <strong>{currentVerb.part}</strong> {currentVerb.altPart && `(${currentVerb.altPart})`}
                  </span>
                )}
              </div>

            </div>
          ) : (
            <div className="relative max-w-md mx-auto">
              <label className="block text-xs font-mono font-bold uppercase tracking-wider text-slate-600 mb-1.5 text-center">
                {verbDirection === 'eng_to_cat' ? 'Traducció al Català' : 'Infinitive en Anglès'}
              </label>
              <div className="relative">
                <input
                  ref={transRef}
                  type="text"
                  autoFocus
                  autoComplete="off"
                  autoCorrect="off"
                  spellCheck="false"
                  value={transInput}
                  onChange={handleTransChange}
                  placeholder={verbDirection === 'eng_to_cat' ? 'Escriu el significat...' : 'Escriu l\'infinitiu...'}
                  className={`w-full text-base font-mono font-semibold px-4 py-3 rounded-xl border-2 text-center transition-all outline-none ${
                    isTransCorrect
                      ? 'border-emerald-500 bg-emerald-50/40 text-emerald-900'
                      : transInput.length > 0
                      ? 'border-amber-400 bg-white text-slate-900'
                      : 'border-slate-200 focus:border-oxford-700 bg-slate-50 focus:bg-white text-slate-900'
                  }`}
                />
                {isTransCorrect && (
                  <span className="absolute right-4 top-3 text-emerald-600 font-bold text-base">✓</span>
                )}
              </div>
              {revealed && (
                <span className="text-xs font-mono text-crimson-700 mt-1.5 block text-center">
                  Solució: <strong>{verbDirection === 'eng_to_cat' ? currentVerb.cat : currentVerb.inf}</strong>
                </span>
              )}
            </div>
          )}
        </div>

        {/* Bottom Actions Bar */}
        <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-6 border-t border-slate-100 text-xs">
          
          <button
            onClick={() => setRevealed(r => !r)}
            className="text-slate-500 hover:text-oxford-900 font-mono underline transition-colors order-2 sm:order-1"
          >
            {revealed ? 'Amagar Solució' : 'Revelar Resposta (Pista)'}
          </button>

          <div className="flex items-center gap-2 order-1 sm:order-2 w-full sm:w-auto">
            <button
              onClick={handlePrev}
              className="flex-1 sm:flex-initial px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 font-semibold text-slate-700 transition-colors"
            >
              &larr; Anterior
            </button>
            <button
              onClick={handleNext}
              className="flex-1 sm:flex-initial px-5 py-2 rounded-lg bg-oxford-900 hover:bg-oxford-800 text-white font-semibold transition-all shadow-xs"
            >
              Següent &rarr;
            </button>
          </div>
        </div>

      </div>

      {/* Hyper-Flow Helper Tip */}
      <div className="text-center font-mono text-[11px] text-slate-400">
        💡 <strong>Mode Hyper-Flow actiu:</strong> Els camps avancen automàticament sense haver de prémer Enter en encertar la forma correcta.
      </div>
    </div>
  );
}

// --- VOCABULARY & IDIOMS TRAINER (WITH SUPABASE MISTAKES INTEGRATION) ---
function VocabTrainer({ onCompleteAction, session }) {
  const [selectedDay, setSelectedDay] = useState('ALL'); // 'ALL' | 'Dilluns' | 'Dimarts' | 'Divendres'
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [studyDirection, setStudyDirection] = useState('cat_to_eng'); // 'cat_to_eng' | 'eng_to_cat'
  const [historyStack, setHistoryStack] = useState([]);
  const [hardCount, setHardCount] = useState(0);
  const [easyCount, setEasyCount] = useState(0);
  const [savingNotice, setSavingNotice] = useState('');

  // Filtered Cards
  const cards = useMemo(() => {
    if (selectedDay === 'ALL') return VOCAB_DATA;
    return VOCAB_DATA.filter(item => item.day === selectedDay);
  }, [selectedDay]);

  const currentCard = cards[currentIndex] || cards[0];

  // Reset flip on index change
  useEffect(() => {
    setIsFlipped(false);
  }, [currentIndex, selectedDay]);

  // Keyboard Shortcuts (1 = Difícil, 2 = Fàcil, Espai = Girar)
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.code === 'Space') {
        e.preventDefault();
        setIsFlipped(f => !f);
      } else if (e.key === '1') {
        e.preventDefault();
        handleHard();
      } else if (e.key === '2') {
        e.preventDefault();
        handleEasy();
      } else if ((e.metaKey || e.ctrlKey) && e.key === 'z') {
        e.preventDefault();
        handleUndo();
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [currentIndex, cards, session, currentCard]);

  // Action: Hard (Repeat) - RECORD TO SUPABASE user_mistakes TABLE
  const handleHard = async () => {
    setHistoryStack(prev => [...prev, { index: currentIndex, action: 'hard' }]);
    setHardCount(h => h + 1);

    // Save mistake to Supabase if authenticated and client is present
    if (session && session.user && supabaseClient && currentCard) {
      try {
        setSavingNotice('Guardant error a Supabase...');
        const userId = session.user.id;
        const wordId = String(currentCard.id);

        // 1. Query existing mistake count
        const { data: existing, error: selectErr } = await supabaseClient
          .from('user_mistakes')
          .select('mistake_count')
          .eq('user_id', userId)
          .eq('word_id', wordId)
          .maybeSingle();

        if (selectErr) {
          console.warn('Error querying user_mistakes:', selectErr.message);
        }

        if (existing) {
          // 2. Increment mistake_count
          const newCount = (existing.mistake_count || 1) + 1;
          const { error: updateErr } = await supabaseClient
            .from('user_mistakes')
            .update({ mistake_count: newCount })
            .eq('user_id', userId)
            .eq('word_id', wordId);

          if (updateErr) console.warn('Error updating user_mistakes:', updateErr.message);
        } else {
          // 3. Insert new row with mistake_count: 1
          const { error: insertErr } = await supabaseClient
            .from('user_mistakes')
            .insert({
              user_id: userId,
              word_id: wordId,
              mistake_count: 1,
            });

          if (insertErr) console.warn('Error inserting user_mistakes:', insertErr.message);
        }

        setSavingNotice('✓ Error registrat a la base de dades');
        setTimeout(() => setSavingNotice(''), 2000);
      } catch (err) {
        console.error('Failed to record user mistake:', err);
        setSavingNotice('');
      }
    }

    advanceNext();
  };

  // Action: Easy (Consolidated)
  const handleEasy = () => {
    setHistoryStack(prev => [...prev, { index: currentIndex, action: 'easy' }]);
    setEasyCount(e => e + 1);
    if (onCompleteAction) onCompleteAction();
    advanceNext();
  };

  const advanceNext = () => {
    if (currentIndex < cards.length - 1) {
      setCurrentIndex(prev => prev + 1);
    } else {
      setCurrentIndex(0);
      if (window.confetti) {
        window.confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } });
      }
    }
  };

  // Action: Undo
  const handleUndo = () => {
    if (historyStack.length === 0) return;
    const last = historyStack[historyStack.length - 1];
    setHistoryStack(prev => prev.slice(0, -1));
    setCurrentIndex(last.index);
    if (last.action === 'hard') setHardCount(h => Math.max(0, h - 1));
    if (last.action === 'easy') setEasyCount(e => Math.max(0, e - 1));
  };

  return (
    <div className="space-y-6 max-w-3xl mx-auto">
      
      {/* Top Filter & Controls Bar */}
      <div className="bg-white rounded-xl border border-slate-200/90 p-4 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
        
        {/* Day Filters */}
        <div className="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 text-xs font-semibold">
          <span className="text-slate-400 font-mono text-[11px] mr-1 hidden sm:inline">Setmana:</span>
          {['ALL', 'Dilluns', 'Dimarts', 'Divendres'].map(day => (
            <button
              key={day}
              onClick={() => { setSelectedDay(day); setCurrentIndex(0); setHistoryStack([]); }}
              className={`px-3 py-1.5 rounded-lg transition-all ${
                selectedDay === day
                  ? 'bg-crimson-700 text-white shadow-xs font-bold'
                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
              }`}
            >
              {day === 'ALL' ? 'Tots (107)' : day}
            </button>
          ))}
        </div>

        {/* Direction Switcher & Undo Button */}
        <div className="flex items-center gap-2 self-end sm:self-auto">
          <button
            onClick={() => setStudyDirection(d => d === 'cat_to_eng' ? 'eng_to_cat' : 'cat_to_eng')}
            className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 transition-colors flex items-center gap-1.5"
            title="Invertir anvers i revers de la targeta"
          >
            <span>{studyDirection === 'cat_to_eng' ? '🇦🇩 Català &rarr; 🇬🇧 Anglès' : '🇬🇧 Anglès &rarr; 🇦🇩 Català'}</span>
          </button>

          <button
            onClick={handleUndo}
            disabled={historyStack.length === 0}
            className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-xs font-semibold text-slate-700 transition-colors"
            title="Desfer darrera acció (Ctrl+Z)"
          >
            ↩ Desfer
          </button>
        </div>
      </div>

      {/* Progress & Persistence Notice Bar */}
      <div className="flex items-center justify-between px-2 text-xs font-mono">
        <span className="text-slate-500">
          Targeta <strong>{currentIndex + 1}</strong> de {cards.length} &bull; Bloc: <span className="font-semibold text-oxford-900">{currentCard.day}</span>
        </span>
        <div className="flex items-center gap-3">
          {savingNotice && (
            <span className="text-[11px] text-amber-700 font-semibold animate-pulse">
              {savingNotice}
            </span>
          )}
          <span className="text-crimson-700 font-bold">Repetir: {hardCount}</span>
          <span className="text-emerald-700 font-bold">Fàcil: {easyCount}</span>
        </div>
      </div>

      {/* 3D FLASHCARD PERSPECTIVE CONTAINER */}
      <div className="perspective-container h-80 sm:h-96 w-full cursor-pointer select-none" onClick={() => setIsFlipped(f => !f)}>
        <div className={`card-3d-inner shadow-lg ${isFlipped ? 'flipped' : ''}`}>
          
          {/* FRONT FACE (Oxford Academic Style) */}
          <div className="card-face bg-white border-2 border-slate-200/90 p-8 flex flex-col justify-between hover:border-oxford-700 transition-colors">
            <div className="flex items-center justify-between">
              <span className="text-xs uppercase font-mono tracking-widest text-slate-400 font-bold">
                Anvers &bull; {studyDirection === 'cat_to_eng' ? 'Català' : 'English'}
              </span>
              <span className="text-xs font-mono px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                Prem Espai per girar
              </span>
            </div>

            <div className="my-auto text-center px-4">
              <p className="text-xl sm:text-2xl font-serif-academic font-bold text-oxford-950 leading-relaxed">
                {studyDirection === 'cat_to_eng' ? currentCard.cat : currentCard.eng}
              </p>
            </div>

            <div className="text-center pt-4 border-t border-slate-100 text-xs text-slate-400 font-mono">
              Fes clic a la targeta o prem [Espai] per veure el revers &bull; Safe Active Recall
            </div>
          </div>

          {/* BACK FACE (Crimson Academic Style) */}
          <div className="card-face card-face-back bg-oxford-900 text-white border-2 border-crimson-700 p-8 flex flex-col justify-between">
            <div className="flex items-center justify-between">
              <span className="text-xs uppercase font-mono tracking-widest text-amber-300 font-bold">
                Revers &bull; {studyDirection === 'cat_to_eng' ? 'English (PAU Target)' : 'Català'}
              </span>
              <span className="text-xs font-mono px-2 py-0.5 rounded bg-oxford-800 text-slate-300 border border-white/10">
                Solució Oficial
              </span>
            </div>

            <div className="my-auto text-center px-4">
              <p className="text-xl sm:text-2xl font-serif-academic font-bold text-white leading-relaxed">
                {studyDirection === 'cat_to_eng' ? currentCard.eng : currentCard.cat}
              </p>
            </div>

            <div className="text-center pt-4 border-t border-white/10 text-xs text-slate-300 font-mono">
              Avalua el teu record: 1 = Difícil | 2 = Fàcil
            </div>
          </div>

        </div>
      </div>

      {/* Decision Buttons (1 = Hard, 2 = Easy) */}
      <div className="grid grid-cols-2 gap-4 max-w-md mx-auto pt-2">
        <button
          onClick={handleHard}
          className="flex flex-col items-center justify-center p-3.5 rounded-xl bg-white border-2 border-crimson-200 hover:border-crimson-600 hover:bg-crimson-50 text-crimson-700 font-bold transition-all shadow-sm"
        >
          <span className="text-sm">Difícil (Repetir)</span>
          <span className="text-[11px] font-mono text-slate-400 font-normal mt-0.5">Tecla [1] &bull; Desa a DB</span>
        </button>

        <button
          onClick={handleEasy}
          className="flex flex-col items-center justify-center p-3.5 rounded-xl bg-white border-2 border-emerald-200 hover:border-emerald-600 hover:bg-emerald-50 text-emerald-700 font-bold transition-all shadow-sm"
        >
          <span className="text-sm">Fàcil (Consolidat)</span>
          <span className="text-[11px] font-mono text-slate-400 font-normal mt-0.5">Tecla [2]</span>
        </button>
      </div>

      {/* Keyboard Shortcuts Legend */}
      <div className="text-center font-mono text-[11px] text-slate-400 pt-2">
        ⌨️ <strong>Dreceres:</strong> [Espai] Girar targeta &bull; [1] Difícil (guarda a Supabase) &bull; [2] Fàcil &bull; [Ctrl+Z] Desfer
      </div>

    </div>
  );
}

// --- REACT MOUNTING ---
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AuthApp />);
</script>
</body>
