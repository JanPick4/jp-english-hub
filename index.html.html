function cleanStr(s) {
  return (s || '').toLowerCase().trim().replace(/[.,/#!$%^&*;:{}=\-_`~()?"']/g, "").replace(/\s+/g, ' ');
}

function checkVerbMatch(userVal, correctVal, altVal) {
  if (!userVal) return false;
  const cleanUser = userVal.toLowerCase().trim();
  const cleanCorrect = (correctVal || "").toLowerCase().trim();
  const cleanAlt = (altVal || "").toLowerCase().trim();
  return cleanUser === cleanCorrect || (cleanAlt && cleanUser === cleanAlt);
}

function checkMeaningMatch(userVal, meaningStr) {
  if (!userVal || !meaningStr) return false;
  const u = cleanStr(userVal);
  if (!u || u.length < 2) return false;
  const parts = meaningStr.split(/[,/]/).map(cleanStr);
  return parts.some(p => p === u);
}

        const yesterday = new Date(Date.now() - 86400000).toDateString();

            <p className="mt-2 text-xs sm:text-sm text-slate-600 leading-relaxed">Targetes flashcard 3D amb mètode Safe Active Recall, dreceres de teclat i canvi de direcció d'estudi.</p>
          </div>
          <div className="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-crimson-700 group-hover:translate-x-1 transition-transform">
            <span>Practicar targetes</span><span className="text-sm">&rarr;</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function VerbsTrainer({ onCompleteAction }) {
  const [mode, setMode] = useState('forms');
  const [verbDirection, setVerbDirection] = useState('eng_to_cat');
  const [selectedPattern, setSelectedPattern] = useState('ALL');
  const [searchQuery, setSearchQuery] = useState('');
  const [verbsOrder, setVerbsOrder] = useState([...VERBS_DATA]);
  const [answers, setAnswers] = useState({});
  const [revealed, setRevealed] = useState({});

  const inputRefs = useRef({});

  const filteredVerbs = useMemo(() => {
    return verbsOrder.filter(verb => {
      const matchesPattern = selectedPattern === 'ALL' || verb.type === selectedPattern;
      const q = searchQuery.toLowerCase().trim();
      const matchesSearch = !q || verb.inf.toLowerCase().includes(q) || verb.cat.toLowerCase().includes(q) || verb.past.toLowerCase().includes(q) || verb.part.toLowerCase().includes(q);
      return matchesPattern && matchesSearch;
    });
  }, [verbsOrder, selectedPattern, searchQuery]);

  const completedCount = useMemo(() => {
    return filteredVerbs.filter(v => {
      if (revealed[v.id]) return true;
      if (mode === 'forms') {
        return checkVerbMatch(answers[`${v.id}_past`], v.past, v.altPast) && checkVerbMatch(answers[`${v.id}_part`], v.part, v.altPart);
      } else {
        if (verbDirection === 'eng_to_cat') return checkMeaningMatch(answers[`${v.id}_cat`], v.cat);
        if (verbDirection === 'cat_to_eng') return checkVerbMatch(answers[`${v.id}_inf`], v.inf);
      }
      return false;
    }).length;
  }, [filteredVerbs, answers, revealed, mode, verbDirection]);

  const handleShuffle = () => setVerbsOrder([...verbsOrder].sort(() => Math.random() - 0.5));
  const handleReset = () => {
    if (confirm("Vols reiniciar totes les respostes introduïdes?")) { setAnswers({}); setRevealed({}); }
  };

  const handleInputChange = (verb, field, value) => {
    const key = `${verb.id}_${field}`;
    setAnswers(prev => ({ ...prev, [key]: value }));

    if (mode === 'forms') {
      const isPast = field === 'past';
      const isCorrect = isPast ? checkVerbMatch(value, verb.past, verb.altPast) : checkVerbMatch(value, verb.part, verb.altPart);
      if (isCorrect) {
        if (isPast) {
          const nextKey = `${verb.id}_part`;
          if (inputRefs.current[nextKey]) setTimeout(() => inputRefs.current[nextKey]?.focus(), 15);
        } else {
          const currentIndex = filteredVerbs.findIndex(v => v.id === verb.id);
          if (currentIndex !== -1 && currentIndex + 1 < filteredVerbs.length) {
            const nextKey = `${filteredVerbs[currentIndex + 1].id}_past`;
            if (inputRefs.current[nextKey]) setTimeout(() => inputRefs.current[nextKey]?.focus(), 15);
          } else {
            if (window.confetti) window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
            onCompleteAction();
          }
        }
      }
    } else {
      const isCorrect = verbDirection === 'eng_to_cat' ? checkMeaningMatch(value, verb.cat) : checkVerbMatch(value, verb.inf);
      if (isCorrect) {
        const currentIndex = filteredVerbs.findIndex(v => v.id === verb.id);
        if (currentIndex !== -1 && currentIndex + 1 < filteredVerbs.length) {
          const nextKey = verbDirection === 'eng_to_cat' ? `${filteredVerbs[currentIndex + 1].id}_cat` : `${filteredVerbs[currentIndex + 1].id}_inf`;
          if (inputRefs.current[nextKey]) setTimeout(() => inputRefs.current[nextKey]?.focus(), 15);
        } else {
          if (window.confetti) window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
          onCompleteAction();
        }
      }
    }
  };

  const handleReveal = (verb) => {
    setRevealed(prev => ({ ...prev, [verb.id]: true }));
    if (mode === 'forms') setAnswers(prev => ({ ...prev, [`${verb.id}_past`]: verb.past, [`${verb.id}_part`]: verb.part }));
    else {
      if (verbDirection === 'eng_to_cat') setAnswers(prev => ({ ...prev, [`${verb.id}_cat`]: verb.cat }));
      if (verbDirection === 'cat_to_eng') setAnswers(prev => ({ ...prev, [`${verb.id}_inf`]: verb.inf }));
    }
  };

  return (
    <div className="space-y-6">
      <div className="bg-white border border-slate-200 rounded-xl p-5 sm:p-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div className="flex items-center gap-2">
            <span className="text-[11px] font-mono font-bold uppercase tracking-wider text-oxford-900 bg-oxford-50 px-2 py-0.5 rounded border border-oxford-100">Flux Hyper-Flow</span>
          </div>
          <h1 className="text-2xl font-serif-academic font-bold text-oxford-950 mt-1">Verbs Irregulars (162)</h1>
        </div>
        <div className="flex flex-wrap items-center gap-2.5">
          <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-semibold">
            <button onClick={() => setMode('forms')} className={`px-3 py-1.5 rounded transition-all ${mode === 'forms' ? 'bg-crimson-700 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900'}`}>Formes Verbals</button>
            <button onClick={() => setMode('trans')} className={`px-3 py-1.5 rounded transition-all ${mode === 'trans' ? 'bg-crimson-700 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900'}`}>Traducció</button>
          </div>
          {mode === 'trans' && (
            <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-semibold">
              <button onClick={() => setVerbDirection('eng_to_cat')} className={`px-3 py-1.5 rounded transition-all ${verbDirection === 'eng_to_cat' ? 'bg-oxford-900 text-white shadow-xs' : 'text-slate-600'}`}>Anglès &rarr; Català</button>
              <button onClick={() => setVerbDirection('cat_to_eng')} className={`px-3 py-1.5 rounded transition-all ${verbDirection === 'cat_to_eng' ? 'bg-oxford-900 text-white shadow-xs' : 'text-slate-600'}`}>Català &rarr; Anglès</button>
            </div>
          )}
          <button onClick={handleShuffle} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-semibold transition-colors flex items-center gap-1"><span>🔀</span> Barrejar</button>
          <button onClick={handleReset} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-semibold transition-colors flex items-center gap-1"><span>🔄</span> Reiniciar</button>
        </div>
      </div>

      <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
          {[{ id: 'ALL', label: 'Tots (162)' }, { id: 'AAA', label: 'AAA (21)' }, { id: 'ABA', label: 'ABA (4)' }, { id: 'ABB', label: 'ABB (75)' }, { id: 'ABC', label: 'ABC (62)' }].map(tab => (
            <button key={tab.id} onClick={() => setSelectedPattern(tab.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold font-mono whitespace-nowrap transition-all ${selectedPattern === tab.id ? 'bg-oxford-900 text-white shadow-xs' : 'bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 border border-slate-200'}`}>{tab.label}</button>
          ))}
        </div>
      </div>

      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
        <div className="divide-y divide-slate-100 max-h-[640px] overflow-y-auto">
          {filteredVerbs.map((verb, idx) => {
            const isRevealed = !!revealed[verb.id];
            if (mode === 'forms') {
              const pastVal = answers[`${verb.id}_past`] || '';
              const partVal = answers[`${verb.id}_part`] || '';
              const isPastOK = checkVerbMatch(pastVal, verb.past, verb.altPast) || isRevealed;
              const isPartOK = checkVerbMatch(partVal, verb.part, verb.altPart) || isRevealed;
              const isComplete = isPastOK && isPartOK;
              return (
                <div key={verb.id} className={`grid grid-cols-12 gap-2 sm:gap-4 items-center px-4 py-2.5 transition-colors ${isComplete ? 'bg-emerald-50/70' : idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}`}>
                  <div className="col-span-1 hidden sm:block"><span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200 font-semibold">{verb.type}</span></div>
                  <div className="col-span-4 sm:col-span-3">
                    <div className="font-mono font-bold text-oxford-950 text-sm sm:text-base">{verb.inf}</div>
                    <div className="text-xs text-slate-500 truncate">{verb.cat}</div>
                  </div>
                  <div className="col-span-3 sm:col-span-3">
                    <input ref={el => inputRefs.current[`${verb.id}_past`] = el} type="text" value={isRevealed ? verb.past : pastVal} disabled={isPastOK} onChange={(e) => handleInputChange(verb, 'past', e.target.value)} placeholder="Passat simple..." autoComplete="off" spellCheck="false" className={`w-full font-mono text-base md:text-sm px-2.5 py-1.5 rounded-lg border ${isPastOK ? 'bg-emerald-50 border-emerald-300 text-emerald-800 font-bold' : 'bg-white border-slate-300'}`}/>
                  </div>
                  <div className="col-span-4 sm:col-span-3">
                    <input ref={el => inputRefs.current[`${verb.id}_part`] = el} type="text" value={isRevealed ? verb.part : partVal} disabled={isPartOK} onChange={(e) => handleInputChange(verb, 'part', e.target.value)} placeholder="Participi..." autoComplete="off" spellCheck="false" className={`w-full font-mono text-base md:text-sm px-2.5 py-1.5 rounded-lg border ${isPartOK ? 'bg-emerald-50 border-emerald-300 text-emerald-800 font-bold' : 'bg-white border-slate-300'}`}/>
                  </div>
                  <div className="col-span-1 sm:col-span-2 text-right">
                    {!isComplete && <button onClick={() => handleReveal(verb)} className="text-[11px] text-slate-400 hover:text-crimson-700 py-1 px-2 rounded hover:bg-slate-100">Revelar</button>}
                  </div>
                </div>
              );
            } else {
              const isEngToCat = verbDirection === 'eng_to_cat';
              const inputKey = isEngToCat ? `${verb.id}_cat` : `${verb.id}_inf`;
              const inputVal = answers[inputKey] || '';
              const isOK = (isEngToCat ? checkMeaningMatch(inputVal, verb.cat) : checkVerbMatch(inputVal, verb.inf)) || isRevealed;

              return (
                <div key={verb.id} className={`grid grid-cols-12 gap-2 sm:gap-4 items-center px-4 py-2.5 transition-colors ${isOK ? 'bg-emerald-50/70' : idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}`}>
                  <div className="col-span-1 hidden sm:block"><span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200 font-semibold">{verb.type}</span></div>
                  <div className="col-span-4 sm:col-span-4">
                    <div className="font-mono font-bold text-oxford-950 text-sm">{isEngToCat ? verb.inf : verb.cat}</div>
                    {isEngToCat && <div className="text-[11px] font-mono text-slate-500">{verb.past} / {verb.part}</div>}
                  </div>
                  <div className="col-span-7 sm:col-span-5">
                    <input ref={el => inputRefs.current[inputKey] = el} type="text" value={isRevealed ? (isEngToCat ? verb.cat : verb.inf) : inputVal} disabled={isOK} onChange={(e) => handleInputChange(verb, isEngToCat ? 'cat' : 'inf', e.target.value)} placeholder={isEngToCat ? "Significat en català..." : "Infinitiu en anglès..."} autoComplete="off" spellCheck="false" className={`w-full text-base md:text-sm px-2.5 py-1.5 rounded-lg border ${isOK ? 'bg-emerald-50 border-emerald-300 text-emerald-800 font-bold' : 'bg-white border-slate-300'}`}/>
                  </div>
                  <div className="col-span-1 sm:col-span-2 text-right">
                    {!isOK && <button onClick={() => handleReveal(verb)} className="text-[11px] text-slate-400 hover:text-crimson-700 py-1 px-2 rounded hover:bg-slate-100">Revelar</button>}
                  </div>
                </div>
              );
            }
          })}
        </div>
      </div>
    </div>
  );
}

function VocabTrainer({ onCompleteAction }) {
  const [direction, setDirection] = useState('eng_to_cat');
  const [selectedDay, setSelectedDay] = useState('ALL');
  const [queue, setQueue] = useState([]);
  const [mastered, setMastered] = useState([]);
  const [isFlipped, setIsFlipped] = useState(false);
  const [history, setHistory] = useState([]);

  useEffect(() => {
    const initNewDeck = () => {
      const pool = selectedDay === 'ALL' ? [...VOCAB_DATA] : VOCAB_DATA.filter(item => item.day === selectedDay);
      setQueue([...pool].sort(() => Math.random() - 0.5));
      setMastered([]);
    };
    initNewDeck();
    setIsFlipped(false);
    setHistory([]);
  }, [selectedDay]);

  const currentCard = queue[0] || null;
  const handleFlip = () => setIsFlipped(prev => !prev);
  const handleEasy = () => {
    if (!currentCard) return;
    setHistory(prev => [...prev, { card: currentCard, prevQueue: [...queue], prevMastered: [...mastered] }]);
    const nextQueue = queue.slice(1);
    setMastered([currentCard, ...mastered]);
    setQueue(nextQueue);
    setIsFlipped(false);
    if (nextQueue.length === 0) { if (window.confetti) window.confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } }); onCompleteAction(); }
  };
  const handleHard = () => {
    if (!currentCard) return;
    setHistory(prev => [...prev, { card: currentCard, prevQueue: [...queue], prevMastered: [...mastered] }]);
    setQueue([...queue.slice(1), currentCard]);
    setIsFlipped(false);
  };
  const handleUndo = () => {
    if (history.length === 0) return;
    const lastAction = history[history.length - 1];
    setQueue(lastAction.prevQueue);
    setMastered(lastAction.prevMastered);
    setHistory(prev => prev.slice(0, -1));
    setIsFlipped(true);
  };

  const frontLabel = direction === 'eng_to_cat' ? 'Anglès (Expressió Clau)' : 'Català (Context / Frase)';
  const backLabel = direction === 'eng_to_cat' ? 'Català (Traducció)' : 'Anglès (Expressió Clau)';
  const frontText = currentCard ? (direction === 'eng_to_cat' ? currentCard.eng : currentCard.cat) : '';
  const backText = currentCard ? (direction === 'eng_to_cat' ? currentCard.cat : currentCard.eng) : '';

  return (
    <div className="space-y-6 max-w-2xl mx-auto">
      <div className="bg-white border border-slate-200 rounded-xl p-5 sm:p-6 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 className="text-2xl font-serif-academic font-bold text-oxford-950 mt-1">Vocabulari & Idioms (107)</h1>
        </div>
        <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-semibold">
          <button onClick={() => setDirection('eng_to_cat')} className={`px-2.5 py-1 rounded transition-all ${direction === 'eng_to_cat' ? 'bg-white text-oxford-900 font-bold shadow-xs' : 'text-slate-600'}`}>Anglès &rarr; Català</button>
          <button onClick={() => setDirection('cat_to_eng')} className={`px-2.5 py-1 rounded transition-all ${direction === 'cat_to_eng' ? 'bg-white text-oxford-900 font-bold shadow-xs' : 'text-slate-600'}`}>Català &rarr; Anglès</button>
        </div>
      </div>
      <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
        <div className="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto">
          {[{ id: 'ALL', label: 'Tots (107)' }, { id: 'Dilluns', label: 'Dilluns (32)' }, { id: 'Dimarts', label: 'Dimarts (31)' }, { id: 'Divendres', label: 'Divendres (38)' }].map(tab => (
            <button key={tab.id} onClick={() => setSelectedDay(tab.id)} className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all ${selectedDay === tab.id ? 'bg-oxford-900 text-white shadow-xs' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}>{tab.label}</button>
          ))}
        </div>
        <button onClick={handleUndo} disabled={history.length === 0} className="px-3 py-1.5 rounded-lg text-xs font-semibold border bg-slate-100 text-slate-800 disabled:opacity-50">↩️ Desfer</button>
      </div>

      {currentCard ? (
        <div className="space-y-4">
          <div onClick={handleFlip} className="perspective-container cursor-pointer select-none h-64 sm:h-72 w-full">
            <div className={`card-3d-inner shadow-md hover:shadow-lg transition-shadow ${isFlipped ? 'flipped' : ''}`}>
              <div className="card-face bg-white border-2 border-slate-200 p-6 flex flex-col justify-between">
                <div className="text-center my-auto py-2">
                  <span className="text-[11px] uppercase text-crimson-700 font-mono font-bold block mb-2">{frontLabel}</span>
                  <p className="text-lg sm:text-xl font-sans font-bold text-slate-900 leading-relaxed px-4">{frontText}</p>
                </div>
              </div>
              <div className="card-face card-face-back bg-slate-50 border-2 border-oxford-700/70 p-6 flex flex-col justify-between">
                <div className="text-center my-auto py-2">
                  <span className="text-[11px] uppercase text-oxford-700 font-mono font-bold block mb-2">{backLabel}</span>
                  <p className="text-lg sm:text-xl font-sans font-bold text-oxford-950 leading-relaxed px-4">{backText}</p>
                </div>
              </div>
            </div>
          </div>
          {isFlipped && (
            <div className="grid grid-cols-2 gap-3 pt-1">
              <button onClick={handleHard} className="p-3.5 rounded-xl bg-white border border-amber-300 text-amber-900 font-bold text-sm shadow-xs">🔁 Difícil</button>
              <button onClick={handleEasy} className="p-3.5 rounded-xl bg-white border border-emerald-400 text-emerald-900 font-bold text-sm shadow-xs">✨ Fàcil</button>
            </div>
          )}
        </div>
      ) : (
        <div className="rounded-xl bg-white border border-slate-200 p-8 text-center space-y-4 shadow-sm">
          <h2 className="text-xl font-serif-academic font-bold text-oxford-950">Sessió Finalitzada</h2>
          <p className="text-xs sm:text-sm text-slate-600">Has dominat {mastered.length} expressions.</p>
        </div>
      )}
    </div>
  );
}

function AuthApp() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [authMode, setAuthMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [errorMsg, setErrorMsg] = useState('');
  const [successMsg, setSuccessMsg] = useState('');

  useEffect(() => {
    if (supabaseClient) {
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        setSession(session);
        setLoading(false);
      });
      const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
        setSession(session);
        setLoading(false);
      });
      return () => subscription.unsubscribe();
    } else setLoading(false);
  }, []);

  const handleAuth = async (e) => {
    e.preventDefault();
    if (authMode === 'login') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) setErrorMsg('Correu o contrasenya incorrectes.');
    } else {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) setErrorMsg(error.message);
    }
  };

  const handleLogout = async () => { if (supabaseClient) await supabaseClient.auth.signOut(); };

  if (loading) return <div className="min-h-screen bg-oxford-950 text-white flex items-center justify-center">Verificant...</div>;
  if (session) return <App userEmail={session.user?.email} onLogout={handleLogout} />;

  return (
    <div className="min-h-screen bg-[#f8fafc] flex flex-col justify-center items-center p-4">
      <div className="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-xl p-8">
        <h1 className="text-2xl font-serif-academic font-bold text-oxford-950 text-center mb-6">JP ENGLISH HUB</h1>
        <div className="flex bg-slate-100 p-1 rounded-xl mb-6 text-xs font-semibold">
          <button onClick={() => setAuthMode('login')} className={`flex-1 py-2 rounded-lg ${authMode === 'login' ? 'bg-oxford-900 text-white' : 'text-slate-600'}`}>Iniciar Sessió</button>
          <button onClick={() => setAuthMode('register')} className={`flex-1 py-2 rounded-lg ${authMode === 'register' ? 'bg-oxford-900 text-white' : 'text-slate-600'}`}>Crear Compte</button>
        </div>
        {errorMsg && <div className="mb-4 p-3 bg-crimson-50 text-crimson-800 text-xs rounded-lg">{errorMsg}</div>}
        <form onSubmit={handleAuth} className="space-y-4">
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Correu" required className="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-300"/>
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Contrasenya" required className="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-300"/>
          <button type="submit" className="w-full py-2.5 bg-crimson-700 text-white font-bold text-sm rounded-lg">{authMode === 'login' ? 'Entrar' : 'Registrar'}</button>
        </form>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthApp />);
</script>
</body>
